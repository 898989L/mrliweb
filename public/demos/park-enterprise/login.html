<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 · 智慧园区企业端</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #f5f6f8; }
    .login-app {
      max-width: 750px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--white);
      position: relative;
    }
    .login-hero {
      background: linear-gradient(135deg, #1677ff 0%, #4096ff 100%);
      color: #fff;
      padding: 56px 24px 80px;
      position: relative;
      border-radius: 0 0 24px 24px;
    }
    .login-hero .brand {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 28px;
    }
    .login-hero .logo {
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
    }
    .login-hero .logo svg { width: 24px; height: 24px; }
    .login-hero .brand-text { font-size: 14px; opacity: 0.95; letter-spacing: 0.5px; }
    .login-hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .login-hero p { font-size: 14px; opacity: 0.9; line-height: 1.6; }

    .login-form {
      margin: -50px 20px 0;
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      position: relative;
      z-index: 2;
    }
    .form-tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .form-tabs .tab {
      flex: 1;
      padding: 12px 0;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-3);
      position: relative;
      cursor: pointer;
    }
    .form-tabs .tab.active { color: var(--primary); }
    .form-tabs .tab.active::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -1px;
      width: 32px;
      height: 2px;
      background: var(--primary);
      transform: translateX(-50%);
      border-radius: 1px;
    }

    .input-group {
      margin-bottom: 16px;
    }
    .input-group label {
      font-size: 13px;
      color: var(--text-2);
      display: block;
      margin-bottom: 6px;
    }
    .input-wrap {
      display: flex; align-items: center;
      background: #fafbfc;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      gap: 10px;
      transition: all 0.2s;
    }
    .input-wrap:focus-within {
      border-color: var(--primary);
      background: var(--white);
    }
    .input-wrap svg { width: 18px; height: 18px; color: var(--text-3); flex-shrink: 0; }
    .input-wrap input {
      flex: 1;
      font-size: 14px;
      color: var(--text-1);
    }
    .input-wrap .toggle-eye {
      color: var(--text-3);
      cursor: pointer;
      padding: 4px;
    }
    .input-wrap .send-code {
      color: var(--primary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 0 8px;
      border-left: 1px solid var(--border);
    }
    .input-wrap .send-code.disabled { color: var(--text-3); cursor: not-allowed; }

    .form-error {
      color: var(--danger);
      font-size: 12px;
      margin-top: 4px;
      min-height: 16px;
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 0 24px;
      font-size: 13px;
    }
    .checkbox-wrap {
      display: flex; align-items: center; gap: 6px;
      color: var(--text-2);
      cursor: pointer;
    }
    .checkbox-wrap .box {
      width: 16px; height: 16px;
      border: 1.5px solid #d9d9d9;
      border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
    }
    .checkbox-wrap.checked .box {
      background: var(--primary);
      border-color: var(--primary);
    }
    .checkbox-wrap.checked .box svg { width: 10px; height: 10px; stroke: #fff; fill: none; stroke-width: 3; }
    .form-row .forget { color: var(--primary); }

    .btn-login {
      width: 100%;
      padding: 14px 0;
      background: linear-gradient(135deg, #1677ff 0%, #4096ff 100%);
      color: #fff;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      transition: opacity 0.2s;
    }
    .btn-login:active { opacity: 0.8; }
    .btn-login.loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .footer-link {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-3);
    }
    .footer-link a {
      color: var(--primary);
      font-weight: 500;
    }

    .demo-hint {
      margin: 20px 24px 0;
      padding: 12px 14px;
      background: #fff8e6;
      border: 1px solid #ffe7a6;
      border-radius: var(--radius);
      font-size: 12px;
      color: #cf7c00;
      line-height: 1.6;
    }
    .demo-hint .title { font-weight: 600; margin-bottom: 4px; }
    .demo-hint .row { display: flex; gap: 12px; }
    .demo-hint .quick {
      color: var(--primary);
      font-weight: 500;
      margin-left: auto;
      cursor: pointer;
    }

    .login-footer {
      text-align: center;
      padding: 32px 20px 24px;
      font-size: 11px;
      color: var(--text-3);
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="login-app">
    <div class="login-hero">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
            <path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/>
            <path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/>
          </svg>
        </div>
        <div class="brand-text">智慧园区企业端</div>
      </div>
      <h1>欢迎回来</h1>
      <p>登录后查看水电用量、缴费记录、园区通知</p>
    </div>

    <div class="login-form">
      <div class="form-tabs">
        <div class="tab active" data-method="account" onclick="switchMethod('account')">账号登录</div>
        <div class="tab" data-method="sms" onclick="switchMethod('sms')">短信登录</div>
      </div>

      <!-- 账号登录 -->
      <div id="formAccount">
        <div class="input-group">
          <label>企业账号</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <input type="text" id="inputAccount" placeholder="请输入企业账号 / 手机号" value="blueocean">
          </div>
        </div>
        <div class="input-group">
          <label>登录密码</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="password" id="inputPwd" placeholder="请输入密码" value="123456">
            <div class="toggle-eye" onclick="togglePwd()" id="toggleEye">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </div>
          </div>
          <div class="form-error" id="errAccount"></div>
        </div>
      </div>

      <!-- 短信登录 -->
      <div id="formSms" style="display:none;">
        <div class="input-group">
          <label>手机号</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            <input type="tel" id="inputPhone" placeholder="请输入企业法人手机号" maxlength="11">
          </div>
        </div>
        <div class="input-group">
          <label>验证码</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><circle cx="12" cy="16" r="1"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="text" id="inputCode" placeholder="6 位验证码" maxlength="6">
            <span class="send-code" id="sendCode" onclick="sendSmsCode()">获取验证码</span>
          </div>
          <div class="form-error" id="errSms"></div>
        </div>
      </div>

      <div class="form-row">
        <div class="checkbox-wrap checked" id="remember" onclick="toggleRemember()">
          <div class="box">
            <svg viewBox="0 0 24 24"><polyline points="5 12 10 17 19 8"/></svg>
          </div>
          <span>记住账号</span>
        </div>
        <a href="javascript:void(0)" class="forget" onclick="showToast('请联系物业 021-12345678 找回密码', 2200)">忘记密码？</a>
      </div>

      <button class="btn-login" id="btnLogin" onclick="doLogin()">登 录</button>

      <div class="footer-link">
        还没有企业账号？<a href="register.html">立即注册</a>
      </div>
    </div>

    <div class="demo-hint">
      <div class="row">
        <div>
          <div class="title">演示账号</div>
          <div>账号：blueocean / 密码：123456</div>
        </div>
        <span class="quick" onclick="quickFill()">一键填充</span>
      </div>
    </div>

    <div class="login-footer">
      智慧科技园 © 2026<br>
      技术支持：智慧园区物业服务中心
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script>
    let currentMethod = 'account';
    let pwdVisible = false;

    function switchMethod(m) {
      currentMethod = m;
      document.querySelectorAll('.form-tabs .tab').forEach(t => {
        t.classList.toggle('active', t.dataset.method === m);
      });
      document.getElementById('formAccount').style.display = m === 'account' ? '' : 'none';
      document.getElementById('formSms').style.display = m === 'sms' ? '' : 'none';
    }

    function togglePwd() {
      pwdVisible = !pwdVisible;
      document.getElementById('inputPwd').type = pwdVisible ? 'text' : 'password';
      document.getElementById('toggleEye').style.opacity = pwdVisible ? '1' : '0.6';
    }

    function toggleRemember() {
      document.getElementById('remember').classList.toggle('checked');
    }

    let codeSent = false;
    function sendSmsCode() {
      const phone = document.getElementById('inputPhone').value.trim();
      if (!/^1[3-9]\d{9}$/.test(phone)) {
        document.getElementById('errSms').textContent = '请输入正确的手机号';
        return;
      }
      if (codeSent) return;
      codeSent = true;
      const btn = document.getElementById('sendCode');
      let count = 60;
      btn.classList.add('disabled');
      btn.textContent = `${count}s 后重发`;
      const t = setInterval(() => {
        count--;
        if (count <= 0) {
          clearInterval(t);
          btn.classList.remove('disabled');
          btn.textContent = '获取验证码';
          codeSent = false;
        } else {
          btn.textContent = `${count}s 后重发`;
        }
      }, 1000);
      showToast('验证码已发送（演示版固定为 123456）', 2200);
    }

    function quickFill() {
      document.getElementById('inputAccount').value = 'blueocean';
      document.getElementById('inputPwd').value = '123456';
      switchMethod('account');
      showToast('已填充演示账号');
    }

    function doLogin() {
      const btn = document.getElementById('btnLogin');

      if (currentMethod === 'account') {
        const acc = document.getElementById('inputAccount').value.trim();
        const pwd = document.getElementById('inputPwd').value.trim();
        const err = document.getElementById('errAccount');
        if (!acc) { err.textContent = '请输入企业账号'; return; }
        if (!pwd) { err.textContent = '请输入密码'; return; }
        if (acc !== 'blueocean' || pwd !== '123456') {
          err.textContent = '账号或密码错误（演示账号：blueocean / 123456）';
          return;
        }
        err.textContent = '';
      } else {
        const phone = document.getElementById('inputPhone').value.trim();
        const code = document.getElementById('inputCode').value.trim();
        const err = document.getElementById('errSms');
        if (!/^1[3-9]\d{9}$/.test(phone)) { err.textContent = '请输入正确的手机号'; return; }
        if (code !== '123456') { err.textContent = '验证码错误（演示版固定为 123456）'; return; }
        err.textContent = '';
      }

      btn.classList.add('loading');
      btn.textContent = '登 录 中 …';
      setCurrentTenant(MOCK.tenant);
      setTimeout(() => {
        showToast(`欢迎回来，${MOCK.tenant.shortName}`);
        setTimeout(() => location.href = 'index.html', 600);
      }, 700);
    }
  </script>
</body>
</html>
