<main class="layout"><aside class="primary-side"><a class="primary-item" href="01-厂房空间管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>房产</a><a class="primary-item" href="08-费用收缴概览.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>费用</a><a class="primary-item" href="09-资源授权.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>物联</a><a class="primary-item" href="11-巡检点管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>巡检</a><a class="primary-item active" href="16-合同类型管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>合同</a></aside>
<aside class="sub-side"><div class="sub-title">合同管理</div><a class="sub-item" href="16-合同类型管理.html">合同类型</a><a class="sub-item" href="17-合同甲方管理.html">合同甲方</a><a class="sub-item active" href="18-起草合同管理.html">起草合同</a><a class="sub-item" href="19-内部合同管理.html">内部合同</a><a class="sub-item" href="20-合同查询.html">合同查询</a><a class="sub-item" href="21-外部合同管理.html">外部合同</a><a class="sub-item" href="22-合同变更管理.html">合同变更</a><a class="sub-item" href="23-到期合同管理.html">到期合同</a></aside>
<section class="workspace"><div class="toast-wrap" id="toastWrap"></div>
<section class="panel"><div class="panel-head"><span>起草合同</span><div class="btn-row"><a class="btn light" href="18-起草合同管理.html">← 返回</a></div></div><div class="panel-body">

  <div style="font-weight:800;font-size:16px;margin-bottom:20px">合同基本信息</div>
  <div class="filters" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:24px">
    <div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">合同名称</label><div class="input"><input id="eContractName" style="border:0;outline:0;width:100%;background:transparent" placeholder="请输入合同名称"></div></div>
    <div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">合同编号</label><div class="input"><input id="eContractCode" style="border:0;outline:0;width:100%;background:transparent" placeholder="请输入合同编号"></div></div>
    <div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">合同类型</label><div class="select"><select id="eContractType" style="border:0;outline:0;width:100%;background:transparent;color:inherit"><option value="">请选择合同类型</option><option>厂房租赁合同</option><option>工程类合同</option><option>服务合同</option></select></div></div>
  </div>

  <div style="font-weight:800;font-size:16px;margin-bottom:20px">甲方信息</div>
  <div class="filters" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:24px">
    <div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">甲方</label><div class="select"><select id="ePartyA" style="border:0;outline:0;width:100%;background:transparent;color:inherit" onchange="onPartyAChange()"><option value="">请选择甲方</option><option>江西盛源产业运营服务有限公司</option><option>盛源印花产业园管理处</option></select></div></div>
    <div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">甲方联系人</label><div class="input"><input id="eAContact" style="border:0;outline:0;width:100%;background:transparent" readonly></div></div>
    <div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">甲方联系电话</label><div class="input"><input id="eALink" style="border:0;outline:0;width:100%;background:transparent" readonly></div></div>
  </div>

  <div style="font-weight:800;font-size:16px;margin-bottom:20px">乙方信息</div>
  <div class="filters" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:24px">
    <div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">乙方</label><div style="display:flex;gap:8px"><div class="input" style="flex:1"><input id="ePartyB" style="border:0;outline:0;width:100%;background:transparent" placeholder="请输入乙方名称"></div><a class="btn light" style="height:44px" onclick="openOwnerModal('ePartyB','eBContact','eBLink')">选择</a></div></div>
    <div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">乙方联系人</label><div class="input"><input id="eBContact" style="border:0;outline:0;width:100%;background:transparent" placeholder="乙方联系人"></div></div>
    <div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">乙方联系电话</label><div class="input"><input id="eBLink" style="border:0;outline:0;width:100%;background:transparent" placeholder="乙方联系电话"></div></div>
  </div>

  <div style="font-weight:800;font-size:16px;margin-bottom:20px">合同详情</div>
  <div class="filters" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:24px">
    <div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">经办人</label><div class="input"><input id="eOperator" style="border:0;outline:0;width:100%;background:transparent" placeholder="经办人"></div></div>
    <div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">合同金额</label><div class="input"><input id="eAmount" style="border:0;outline:0;width:100%;background:transparent" placeholder="合同金额"></div></div>
    <div></div>
  </div>
  <div class="filters" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:24px">
    <div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">开始时间</label><div class="input"><input id="eStart" style="border:0;outline:0;width:100%;background:transparent" placeholder="开始时间"></div></div>
    <div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">结束时间</label><div class="input"><input id="eEnd" style="border:0;outline:0;width:100%;background:transparent" placeholder="结束时间"></div></div>
    <div></div>
  </div>

  <div style="font-weight:800;font-size:16px;margin-bottom:20px">附件</div>
  <div style="margin-bottom:24px">
    <input type="file" id="fileInput" style="display:none" accept=".pdf,.jpg,.png" onchange="uploadFile(this)">
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()"><div class="upload-icon">📎</div><div>点击或拖拽上传附件</div><div class="upload-hint">支持 PDF、JPG、PNG</div></div>
  </div>

  <div style="text-align:center;margin-top:10px"><a class="btn" style="width:200px;height:44px" onclick="save()">保存</a></div>

</div></section></section></main>

<div class="modal-overlay" id="modal-owner"><div class="modal"><div class="modal-head"><span>选择乙方</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body">
    <table><thead><tr><th>企业名称</th><th>联系人</th><th>联系电话</th><th style="width:80px">操作</th></tr></thead><tbody>
      <tr><td>南昌博富服饰</td><td>张经理</td><td>138****5678</td><td><a class="link" onclick="selectOwner('南昌博富服饰(张经理)','张经理','138****5678')">选择</a></td></tr>
      <tr><td>江西嘉佳和装配式建筑</td><td>李总</td><td>139****8901</td><td><a class="link" onclick="selectOwner('江西嘉佳和装配式建筑(李总)','李总','139****8901')">选择</a></td></tr>
      <tr><td>江西徐日标建筑工程</td><td>徐总</td><td>137****2345</td><td><a class="link" onclick="selectOwner('江西徐日标建筑工程(徐总)','徐总','137****2345')">选择</a></td></tr>
      <tr><td>江西礼宾建材</td><td>周总</td><td>136****7890</td><td><a class="link" onclick="selectOwner('江西礼宾建材(周总)','周总','136****7890')">选择</a></td></tr>
    </tbody></table>
</div><div class="modal-foot"><a class="btn light" onclick="closeModal()">关闭</a></div></div></div>

<script src="common.js"></script>
<script>
function onPartyAChange(){var v=document.getElementById('ePartyA').value;if(v.indexOf('盛源')>=0){document.getElementById('eAContact').value='王政伟';document.getElementById('eALink').value='138****6789'}else{document.getElementById('eAContact').value='';document.getElementById('eALink').value=''}}
var oName,oContact,oLink;
function openOwnerModal(a,b,c){oName=a;oContact=b;oLink=c;openM('modal-owner')}
function selectOwner(name,contact,link){document.getElementById(oName).value=name;document.getElementById(oContact).value=contact;document.getElementById(oLink).value=link;closeModal()}
function uploadFile(input){if(input.files.length){var f=input.files[0];document.getElementById('uploadZone').innerHTML='<div class="upload-file"><span>'+f.name+' ('+(f.size/1024).toFixed(0)+' KB)</span><span class="remove" onclick="clearUpload()">×</span></div>'}}
function clearUpload(){document.getElementById('fileInput').value='';document.getElementById('uploadZone').innerHTML='<div class="upload-icon">📎</div><div>点击或拖拽上传附件</div><div class="upload-hint">支持 PDF、JPG、PNG</div>'}
function save(){var nm=document.getElementById('eContractName').value.trim();if(!nm){toast('请输入合同名称','warn');return}sessionStorage.setItem('newDraft',JSON.stringify({name:nm,code:document.getElementById('eContractCode').value,type:document.getElementById('eContractType').value}));toast('合同已保存','ok');setTimeout(function(){location.href='18-起草合同管理.html'},1000)}
function openM(id){document.getElementById(id).classList.add('show')}function closeModal(){document.querySelectorAll('.modal-overlay.show').forEach(function(m){m.classList.remove('show')})}
function toast(msg,kind){var w=document.getElementById('toastWrap');var el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.textContent=msg;w.appendChild(el);requestAnimationFrame(function(){el.classList.add('show')});setTimeout(function(){el.classList.remove('show');setTimeout(function(){el.remove()},280)},2500)}
</script>
</body></html>
