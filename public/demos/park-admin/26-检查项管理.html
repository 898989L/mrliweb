<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>检查项管理</title><link rel="stylesheet" href="common.css" />
<style>.type-tag{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800}.type-tag.single{background:#e6f4ff;color:#1677ff}.type-tag.multi{background:#f6f0ff;color:#722ed1}.type-tag.qa{background:#fef3e6;color:#d46b08}tbody tr{transition:background .15s}tbody tr:hover{background:#f7f9fe}.opt-card{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:8px;background:#fafbfc;border:1px solid #ebeff3;border-radius:8px;transition:.15s}.opt-card:hover{border-color:#c4cdd8}.opt-card .idx{width:26px;height:26px;border-radius:50%;background:#e8ecf5;color:#5a6878;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.opt-card input{flex:1;height:34px;border:1px solid transparent;border-radius:6px;padding:0 10px;font-size:13px;background:transparent;outline:none}.opt-card input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(47,140,247,.06)}.opt-card .del{width:26px;height:26px;border-radius:50%;border:none;background:none;color:#bfc7d4;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}.opt-card .del:hover{color:var(--red);background:#fef0f0}.add-opt{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:800;font-size:12px;cursor:pointer;padding:6px 12px;border-radius:6px;margin-top:6px;border:1px dashed #cfe2ff}.add-opt:hover{background:#eef5ff;border-color:var(--blue)}.type-note{font-size:12px;color:var(--muted);margin-top:8px;padding:10px 14px;background:#f8fafc;border-radius:6px;border-left:3px solid var(--blue);line-height:1.7}</style>
</head>
<body>
<header class="topbar"><div class="top-left"><div class="brand">盛源印花</div><nav class="top-menu"><span class="active">首页</span><span>业务受理</span><span>物联网</span><span>常用菜单</span><span>设置</span><span>搜索</span></nav></div><div class="top-user"><span>盛源印花产业园 <i class="chev"></i></span><span>测试2 <i class="chev"></i></span><span>v1.9</span></div></header>
<main class="layout"><aside class="primary-side"><a class="primary-item" href="01-厂房空间管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>房产</a><a class="primary-item" href="08-费用收缴概览.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>费用</a><a class="primary-item" href="09-资源授权.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>物联</a><a class="primary-item active" href="11-巡检点管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>巡检</a><a class="primary-item" href="16-合同类型管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>合同</a></aside>
<aside class="sub-side"><div class="sub-title">巡检管理</div><a class="sub-item" href="15-巡检项目管理.html">巡检项目</a><a class="sub-item" href="11-巡检点管理.html">巡检点</a><a class="sub-item" href="25-巡检路线管理.html">巡检路线</a><a class="sub-item" href="12-巡检计划管理.html">巡检计划</a><a class="sub-item" href="13-巡检任务管理.html">巡检任务</a><a class="sub-item" href="14-巡检明细.html">巡检明细</a><a class="sub-item" href="24-巡检报表.html">巡检报表</a></aside>
<section class="workspace"><div class="toast-wrap" id="toastWrap"></div>
<section class="panel"><div class="panel-head"><span>检查项管理 <span style="font-weight:400;color:var(--muted);font-size:13px">| <b id="itemBreadcrumb">—</b></span></span><div class="btn-row"><a class="btn light" href="15-巡检项目管理.html">← 返回</a><a class="btn" onclick="openModal(-1)">＋ 添加</a></div></div><div class="panel-body">
<div class="filters"><div class="input"><input id="fId" placeholder="题目ID" style="border:0;outline:0;width:100%;background:transparent" oninput="doFilter()"></div><div class="input"><input id="fTitle" placeholder="题目" style="border:0;outline:0;width:100%;background:transparent" oninput="doFilter()"></div><div class="select"><select id="fType" style="border:0;outline:0;width:100%;background:transparent;color:inherit" onchange="doFilter()"><option value="">题目类型</option><option value="1001">单选</option><option value="2002">多选</option><option value="3003">问答</option></select></div><div></div><div></div><button class="btn" onclick="doFilter()">搜索</button><button class="btn gray" onclick="doReset()">重置</button></div>
<table><thead><tr><th>题目ID</th><th>题目</th><th>题目类型</th><th>序号</th><th>创建时间</th><th style="width:110px">操作</th></tr></thead><tbody id="tableBody"></tbody></table>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)"><span>共 <b id="totalCount">0</b> 条</span><div><span style="cursor:pointer" onclick="prevPage()">‹</span> <b id="pageNum">1</b> <span style="cursor:pointer" onclick="nextPage()">›</span></div><span>前往 <input style="width:40px;height:28px;border:1px solid var(--line);border-radius:4px;text-align:center" id="goPage" value="1" onkeydown="if(event.key==='Enter')goToPage()"> 页</span></div>
</div></section></section></main>

<div class="modal-overlay" id="modal-edit"><div class="modal wide"><div class="modal-head"><span id="modalTitle">添加检查项</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body">
  <div style="margin-bottom:14px"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">题目</label><div class="input"><input id="eTitle" style="border:0;outline:0;width:100%;background:transparent" placeholder="请输入题目"></div></div>
  <div style="margin-bottom:14px"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">题目类型</label><div class="select"><select id="eType" style="border:0;outline:0;width:100%;background:transparent;color:inherit" onchange="onTypeChange()"><option value="">请选择题目类型</option><option value="1001">单选</option><option value="2002">多选</option><option value="3003">问答</option></select></div><div class="type-note" id="typeNote" style="display:none"></div></div>
  <div id="optionsWrap" style="display:none;margin-bottom:14px"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:8px">选项列表</label><div id="optionsList"></div><a class="add-opt" onclick="addOpt()">＋ 添加选项</a></div>
  <div style="margin-bottom:14px"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">序号</label><div class="input"><input id="eSeq" type="number" style="border:0;outline:0;width:100%;background:transparent" placeholder="数字越小越靠前" value="1"></div></div>
</div><div class="modal-foot"><a class="btn light" onclick="closeModal()">取消</a><a class="btn" onclick="save()">保存</a></div></div></div>

<div class="modal-overlay" id="modal-delete"><div class="modal"><div class="modal-head"><span>确认删除</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body"><p>确定要删除该题目吗？</p></div><div class="modal-foot"><a class="btn light" onclick="closeModal()">取消</a><a class="btn red" onclick="confirmDelete()">确认删除</a></div></div></div>

<script src="common.js"></script>
<script>
var TL={'1001':'单选','2002':'多选','3003':'问答'},TC={'1001':'single','2002':'multi','3003':'qa'},TH={'1001':'巡检人员从预设选项中选择<b>一个</b>答案。','2002':'巡检人员从预设选项中选择<b>一个或多个</b>答案。','3003':'巡检人员<b>自由填写</b>文字内容。'};
var itemName=(function(){var m=location.search.match(/[?&]item=([^&]*)/);return m?decodeURIComponent(m[1]):'默认巡检项目';})();document.getElementById('itemBreadcrumb').textContent=itemName;
var DM={'变压器巡检':[{id:'1020260501',title:'变压器运行状态',type:'1001',seq:1,time:'2026-04-07 18:30',options:[{v:'正常',s:1},{v:'异常',s:2}]},{id:'1020260502',title:'外观检查项',type:'2002',seq:2,time:'2026-04-07 18:31',options:[{v:'外壳破损',s:1},{v:'渗油',s:2},{v:'异常声响',s:3},{v:'温度过高',s:4}]},{id:'1020260503',title:'巡检备注',type:'3003',seq:3,time:'2026-04-07 18:32',options:[]}],'电梯巡检':[{id:'1020260504',title:'电梯运行是否平稳',type:'1001',seq:1,time:'2026-04-07 17:00',options:[{v:'是',s:1},{v:'否',s:2}]},{id:'1020260505',title:'安全检查备注',type:'3003',seq:2,time:'2026-04-07 17:01',options:[]}],'污水处理厂巡检':[{id:'1020260506',title:'设备运行状态',type:'1001',seq:1,time:'2026-04-07 16:00',options:[{v:'正常',s:1},{v:'异常',s:2}]},{id:'1020260507',title:'水质检测结果',type:'3003',seq:2,time:'2026-04-07 16:01',options:[]}],'监控巡检':[{id:'1020260508',title:'摄像头画面状态',type:'1001',seq:1,time:'2026-04-07 15:00',options:[{v:'清晰',s:1},{v:'模糊',s:2},{v:'无画面',s:3}]},{id:'1020260509',title:'巡检备注',type:'3003',seq:2,time:'2026-04-07 15:01',options:[]}],'气膜设备巡检':[{id:'1020260510',title:'气压是否正常',type:'1001',seq:1,time:'2026-04-07 14:00',options:[{v:'正常',s:1},{v:'异常',s:2}]},{id:'1020260511',title:'巡检备注',type:'3003',seq:2,time:'2026-04-07 14:01',options:[]}],'每月15日柴油发电机测试巡检':[{id:'1020260512',title:'发电机启动是否正常',type:'1001',seq:1,time:'2026-04-07 13:00',options:[{v:'正常',s:1},{v:'异常',s:2}]},{id:'1020260513',title:'输出检测项',type:'2002',seq:2,time:'2026-04-07 13:01',options:[{v:'380V正常',s:1},{v:'电压偏低',s:2},{v:'电压偏高',s:3},{v:'频率异常',s:4}]},{id:'1020260514',title:'燃油系统备注',type:'3003',seq:3,time:'2026-04-07 13:02',options:[]}]};
var allData=DM[itemName]||[],filtered=[],page=1,ps=10,editIdx=-1,delIdx=-1,opts=[];
function render(){var s=(page-1)*ps,pd=filtered.slice(s,s+ps),h='';pd.forEach(function(d,i){h+='<tr><td>'+d.id+'</td><td>'+d.title+'</td><td><span class="type-tag '+TC[d.type]+'">'+TL[d.type]+'</span></td><td>'+d.seq+'</td><td>'+d.time+'</td><td><a class="link" onclick="openModal('+(s+i)+')">编辑</a>　<a class="link red-text" onclick="openDel('+(s+i)+')">删除</a></td></tr>'});if(!pd.length)h='<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--muted)">暂无数据</td></tr>';document.getElementById('tableBody').innerHTML=h;document.getElementById('totalCount').textContent=filtered.length;document.getElementById('pageNum').textContent=page}
function doFilter(){var id=(document.getElementById('fId').value||'').toLowerCase(),tt=(document.getElementById('fTitle').value||'').toLowerCase(),tp=document.getElementById('fType').value;filtered=allData.filter(function(d){return(!id||d.id.toLowerCase().indexOf(id)!==-1)&&(!tt||d.title.toLowerCase().indexOf(tt)!==-1)&&(!tp||d.type===tp)});page=1;render()}
function doReset(){document.getElementById('fId').value='';document.getElementById('fTitle').value='';document.getElementById('fType').value='';doFilter()}
function prevPage(){if(page>1){page--;render()}}function nextPage(){if(page<Math.ceil(filtered.length/ps)){page++;render()}}function goToPage(){var p=parseInt(document.getElementById('goPage').value);if(p>=1&&p<=Math.ceil(filtered.length/ps)){page=p;render()}}
function openModal(i){editIdx=i;opts=[];if(i<0){document.getElementById('modalTitle').textContent='添加检查项';document.getElementById('eTitle').value='';document.getElementById('eType').value='';document.getElementById('eSeq').value='1';hideOpts();hideNote()}else{var d=filtered[i];document.getElementById('modalTitle').textContent='编辑检查项';document.getElementById('eTitle').value=d.title;document.getElementById('eType').value=d.type;document.getElementById('eSeq').value=d.seq;opts=JSON.parse(JSON.stringify(d.options||[]));onTypeChange()}document.getElementById('modal-edit').classList.add('show')}
function onTypeChange(){var tp=document.getElementById('eType').value;if(tp==='3003'){hideOpts();showNote()}else if(tp){showOpts();showNote();if(!opts.length)opts=(tp==='1001'?[{v:'',s:1}]:[{v:'',s:1},{v:'',s:2}])}else{hideOpts();hideNote()}renderOpts()}
function showNote(){var tp=document.getElementById('eType').value,el=document.getElementById('typeNote');el.innerHTML=TH[tp]||'';el.style.display=''}function hideNote(){document.getElementById('typeNote').style.display='none'}
function showOpts(){document.getElementById('optionsWrap').style.display=''}function hideOpts(){document.getElementById('optionsWrap').style.display='none'}
function renderOpts(){var h='';opts.forEach(function(o,i){h+='<div class="opt-card"><span class="idx">'+(i+1)+'</span><input value="'+o.v+'" oninput="opts['+i+'].v=this.value" placeholder="选项 '+(i+1)+'"><button class="del" onclick="removeOpt('+i+')">&times;</button></div>'});document.getElementById('optionsList').innerHTML=h}
function addOpt(){opts.push({v:'',s:opts.length+1});renderOpts()}function removeOpt(i){if(opts.length<=1){toast('至少保留一个选项','warn');return}opts.splice(i,1);opts.forEach(function(o,j){o.s=j+1});renderOpts()}
function save(){var title=document.getElementById('eTitle').value.trim();if(!title){toast('请输入题目','warn');return}var tp=document.getElementById('eType').value;if(!tp){toast('请选择题目类型','warn');return}var seq=parseInt(document.getElementById('eSeq').value)||1;var clean=opts.filter(function(o){return o.v.trim()!==''});clean.forEach(function(o,i){o.s=i+1});if(editIdx<0){allData.push({id:'10202605'+String(Date.now()).slice(-7),title:title,type:tp,seq:seq,time:new Date().toLocaleString('zh-CN').replace(/\//g,'-'),options:clean});toast('巡检项已添加','ok')}else{var t=filtered[editIdx];t.title=title;t.type=tp;t.seq=seq;t.options=clean;toast('已编辑','ok')}closeModal();doFilter()}
function openDel(i){delIdx=i;document.getElementById('modal-delete').classList.add('show')}
function confirmDelete(){var d=filtered[delIdx];allData=allData.filter(function(x){return x.id!==d.id});closeModal();doFilter();toast('已删除','warn')}
function closeModal(){document.querySelectorAll('.modal-overlay.show').forEach(function(m){m.classList.remove('show')})}
function toast(msg,kind){var w=document.getElementById('toastWrap');var el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.textContent=msg;w.appendChild(el);requestAnimationFrame(function(){el.classList.add('show')});setTimeout(function(){el.classList.remove('show');setTimeout(function(){el.remove()},280)},2500)}
doFilter();document.addEventListener('click',function(e){if(e.target.classList.contains('modal-overlay')&&e.target.classList.contains('show'))e.target.classList.remove('show')});
</script>
</body></html>
