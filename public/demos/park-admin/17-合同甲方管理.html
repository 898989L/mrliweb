<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>合同甲方管理</title><link rel="stylesheet" href="common.css" /></head>
<body>
<header class="topbar"><div class="top-left"><div class="brand">盛源印花</div><nav class="top-menu"><span class="active">首页</span><span>业务受理</span><span>物联网</span><span>常用菜单</span><span>设置</span><span>搜索</span></nav></div><div class="top-user"><span>盛源印花产业园 <i class="chev"></i></span><span>测试2 <i class="chev"></i></span><span>v1.9</span></div></header>
<main class="layout"><aside class="primary-side"><a class="primary-item" href="01-厂房空间管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>房产</a><a class="primary-item" href="08-费用收缴概览.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>费用</a><a class="primary-item" href="09-资源授权.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>物联</a><a class="primary-item" href="11-巡检点管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>巡检</a><a class="primary-item active" href="16-合同类型管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>合同</a></aside>
<aside class="sub-side"><div class="sub-title">合同管理</div><a class="sub-item" href="16-合同类型管理.html">合同类型</a><a class="sub-item active" href="17-合同甲方管理.html">合同甲方</a><a class="sub-item" href="18-起草合同管理.html">起草合同</a><a class="sub-item" href="19-内部合同管理.html">内部合同</a><a class="sub-item" href="20-合同查询.html">合同查询</a><a class="sub-item" href="21-外部合同管理.html">外部合同</a><a class="sub-item" href="22-合同变更管理.html">合同变更</a><a class="sub-item" href="23-到期合同管理.html">到期合同</a></aside>
<section class="workspace"><div class="toast-wrap" id="toastWrap"></div>
<section class="panel"><div class="panel-head"><span>合同甲方管理</span><div class="btn-row"><a class="btn" onclick="openAdd()">＋ 添加</a></div></div><div class="panel-body">
<div class="filters"><div class="input"><input id="fParty" placeholder="甲方名称" style="border:0;outline:0;width:100%;background:transparent" oninput="doFilter()"></div><div class="input"><input id="fContact" placeholder="联系人" style="border:0;outline:0;width:100%;background:transparent" oninput="doFilter()"></div><div class="input"><input id="fLink" placeholder="联系电话" style="border:0;outline:0;width:100%;background:transparent" oninput="doFilter()"></div><div></div><div></div><button class="btn" onclick="doFilter()">搜索</button><button class="btn gray" onclick="doReset()">重置</button></div>
<table><thead><tr><th>甲方名称</th><th>联系人</th><th>联系电话</th><th style="width:160px">操作</th></tr></thead><tbody id="tableBody"></tbody></table>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)"><span>共 <b id="totalCount">0</b> 条</span><div><span style="cursor:pointer" onclick="prevPage()">‹</span> <b id="pageNum">1</b> <span style="cursor:pointer" onclick="nextPage()">›</span></div><span>前往 <input style="width:40px;height:28px;border:1px solid var(--line);border-radius:4px;text-align:center" id="goPage" value="1" onkeydown="if(event.key==='Enter')goToPage()"> 页</span></div>
</div></section></section></main>

<div class="modal-overlay" id="modal-edit"><div class="modal"><div class="modal-head"><span id="modalTitle">添加合同甲方</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body">
  <div style="margin-bottom:14px"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">甲方名称</label><div class="input"><input id="eParty" style="border:0;outline:0;width:100%;background:transparent" placeholder="请输入甲方名称"></div></div>
  <div style="margin-bottom:14px"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">联系人</label><div class="input"><input id="eContact" style="border:0;outline:0;width:100%;background:transparent" placeholder="请输入联系人"></div></div>
  <div style="margin-bottom:14px"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">联系电话</label><div class="input"><input id="eLink" style="border:0;outline:0;width:100%;background:transparent" placeholder="请输入联系电话"></div></div>
</div><div class="modal-foot"><a class="btn light" onclick="closeModal()">取消</a><a class="btn" onclick="save()">保存</a></div></div></div>

<div class="modal-overlay" id="modal-delete"><div class="modal"><div class="modal-head"><span>确认删除</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body"><p>确定要删除吗？</p></div><div class="modal-foot"><a class="btn light" onclick="closeModal()">取消</a><a class="btn red" onclick="confirmDelete()">确认删除</a></div></div></div>

<script src="common.js"></script>
<script>
var allData=[{party:'江西盛源产业运营服务有限公司',contact:'王政伟',link:'138****6789'},{party:'盛源印花产业园管理处',contact:'章琼',link:'139****8901'}];
var filtered=[],page=1,ps=10,eIdx=-1,dIdx=-1;
function render(){var s=(page-1)*ps,pd=filtered.slice(s,s+ps),h='';pd.forEach(function(d,i){h+='<tr><td>'+d.party+'</td><td>'+d.contact+'</td><td>'+d.link+'</td><td><a class="link" onclick="openEdit('+(s+i)+')">编辑</a>　<a class="link red-text" onclick="openDel('+(s+i)+')">删除</a></td></tr>'});if(!pd.length)h='<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--muted)">暂无匹配数据</td></tr>';document.getElementById('tableBody').innerHTML=h;document.getElementById('totalCount').textContent=filtered.length;document.getElementById('pageNum').textContent=page}
function doFilter(){var pt=(document.getElementById('fParty').value||'').toLowerCase(),ct=(document.getElementById('fContact').value||'').toLowerCase(),lk=(document.getElementById('fLink').value||'').toLowerCase();filtered=allData.filter(function(d){return(!pt||d.party.toLowerCase().indexOf(pt)!==-1)&&(!ct||d.contact.toLowerCase().indexOf(ct)!==-1)&&(!lk||d.link.toLowerCase().indexOf(lk)!==-1)});page=1;render()}
function doReset(){document.getElementById('fParty').value='';document.getElementById('fContact').value='';document.getElementById('fLink').value='';doFilter()}
function prevPage(){if(page>1){page--;render()}}function nextPage(){if(page<Math.ceil(filtered.length/ps)){page++;render()}}function goToPage(){var p=parseInt(document.getElementById('goPage').value);if(p>=1&&p<=Math.ceil(filtered.length/ps)){page=p;render()}}
function openAdd(){eIdx=-1;document.getElementById('modalTitle').textContent='添加合同甲方';document.getElementById('eParty').value='';document.getElementById('eContact').value='';document.getElementById('eLink').value='';openM('modal-edit')}
function openEdit(i){eIdx=i;var d=filtered[i];document.getElementById('modalTitle').textContent='编辑合同甲方';document.getElementById('eParty').value=d.party;document.getElementById('eContact').value=d.contact;document.getElementById('eLink').value=d.link;openM('modal-edit')}
function save(){var pt=document.getElementById('eParty').value.trim();if(!pt){toast('请输入甲方名称','warn');return}var d={party:pt,contact:document.getElementById('eContact').value,link:document.getElementById('eLink').value};if(eIdx<0){allData.unshift(d);toast('已添加','ok')}else{Object.assign(filtered[eIdx],d);toast('已编辑','ok')}closeModal();doFilter()}
function openDel(i){dIdx=i;openM('modal-delete')}
function confirmDelete(){filtered.splice(dIdx,1);closeModal();doFilter();toast('已删除','warn')}
function openM(id){document.getElementById(id).classList.add('show')}function closeModal(){document.querySelectorAll('.modal-overlay.show').forEach(function(m){m.classList.remove('show')})}
function toast(msg,kind){var w=document.getElementById('toastWrap');var el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.textContent=msg;w.appendChild(el);requestAnimationFrame(function(){el.classList.add('show')});setTimeout(function(){el.classList.remove('show');setTimeout(function(){el.remove()},280)},2500)}
doFilter();document.addEventListener('click',function(e){if(e.target.classList.contains('modal-overlay')&&e.target.classList.contains('show'))e.target.classList.remove('show')});
</script>
</body></html>
