<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>合同类型管理</title><link rel="stylesheet" href="common.css" /></head>
<body>
<header class="topbar"><div class="top-left"><div class="brand">盛源印花</div><nav class="top-menu"><span class="active">首页</span><span>业务受理</span><span>物联网</span><span>常用菜单</span><span>设置</span><span>搜索</span></nav></div><div class="top-user"><span>盛源印花产业园 <i class="chev"></i></span><span>测试2 <i class="chev"></i></span><span>v1.9</span></div></header>
<main class="layout"><aside class="primary-side"><a class="primary-item" href="01-厂房空间管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>房产</a><a class="primary-item" href="08-费用收缴概览.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>费用</a><a class="primary-item" href="09-资源授权.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>物联</a><a class="primary-item" href="11-巡检点管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>巡检</a><a class="primary-item active" href="16-合同类型管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>合同</a></aside>
<aside class="sub-side"><div class="sub-title">合同管理</div><a class="sub-item active" href="16-合同类型管理.html">合同类型</a><a class="sub-item" href="17-合同甲方管理.html">合同甲方</a><a class="sub-item" href="18-起草合同管理.html">起草合同</a><a class="sub-item" href="19-内部合同管理.html">内部合同</a><a class="sub-item" href="20-合同查询.html">合同查询</a><a class="sub-item" href="21-外部合同管理.html">外部合同</a><a class="sub-item" href="22-合同变更管理.html">合同变更</a><a class="sub-item" href="23-到期合同管理.html">到期合同</a></aside>
<section class="workspace"><div class="toast-wrap" id="toastWrap"></div>
<section class="panel"><div class="panel-head"><span>合同类型管理</span><div class="btn-row"><a class="btn light" onclick="openAuditModal()">审核设置</a><a class="btn" onclick="openAdd()">＋ 添加</a></div></div><div class="panel-body">
<div class="filters"><div class="input"><input id="fName" placeholder="类型名称" style="border:0;outline:0;width:100%;background:transparent" oninput="doFilter()"></div><div class="select"><select id="fAudit" style="border:0;outline:0;width:100%;background:transparent;color:inherit" onchange="doFilter()"><option value="">审核</option><option value="是">是</option><option value="否">否</option></select></div><div></div><div></div><div></div><button class="btn" onclick="doFilter()">搜索</button><button class="btn gray" onclick="doReset()">重置</button></div>
<table><thead><tr><th>类型名称</th><th>审核</th><th>备注</th><th>创建时间</th><th style="width:320px">操作</th></tr></thead><tbody id="tableBody"></tbody></table>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)"><span>共 <b id="totalCount">0</b> 条</span><div><span style="cursor:pointer" onclick="prevPage()">‹</span> <b id="pageNum">1</b> <span style="cursor:pointer" onclick="nextPage()">›</span></div><span>前往 <input style="width:40px;height:28px;border:1px solid var(--line);border-radius:4px;text-align:center" id="goPage" value="1" onkeydown="if(event.key==='Enter')goToPage()"> 页</span></div>
</div></section></section></main>

<div class="modal-overlay" id="modal-edit"><div class="modal"><div class="modal-head"><span id="modalTitle">添加合同类型</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body">
  <div style="margin-bottom:14px"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">类型名称</label><div class="input"><input id="eName" style="border:0;outline:0;width:100%;background:transparent" placeholder="请输入类型名称"></div></div>
  <div style="margin-bottom:14px"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">审核</label><div class="select"><select id="eAudit" style="border:0;outline:0;width:100%;background:transparent;color:inherit"><option value="是">是</option><option value="否">否</option></select></div></div>
  <div style="margin-bottom:14px"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">备注</label><textarea id="eRemark" style="width:100%;height:70px;resize:vertical;border:1px solid #d7dfeb;border-radius:4px;padding:10px 15px;font-size:14px;font-family:inherit;color:#1f2d3d;outline:none" placeholder="请输入备注"></textarea></div>
</div><div class="modal-foot"><a class="btn light" onclick="closeModal()">取消</a><a class="btn" onclick="save()">保存</a></div></div></div>

<div class="modal-overlay" id="modal-spec"><div class="modal wide"><div class="modal-head"><span>规格信息</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body" id="specContent"></div><div class="modal-foot"><a class="btn light" onclick="closeModal()">关闭</a></div></div></div>
<div class="modal-overlay" id="modal-template"><div class="modal wide"><div class="modal-head"><span>合同模板</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body">
    <div style="margin-bottom:14px"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:8px">合同属性</label><div style="display:flex;flex-wrap:wrap;gap:8px" id="attrButtons"></div></div>
    <div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:8px">模板内容</label><textarea id="templateEditor" style="width:100%;height:300px;resize:vertical;border:1px solid #d7dfeb;border-radius:4px;padding:12px 15px;font-size:14px;font-family:Consolas,monospace;color:#1f2d3d;outline:none;line-height:1.8" placeholder="在此编辑合同模板内容，可点击上方属性按钮插入变量"></textarea></div>
</div><div class="modal-foot"><a class="btn light" onclick="closeModal()">取消</a><a class="btn" onclick="saveTemplate()">提交</a></div></div></div>
<div class="modal-overlay" id="modal-audit"><div class="modal"><div class="modal-head"><span>审核设置</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body"><p>即将跳转到工作流管理页面进行审核设置。</p><p class="dim" style="margin-top:8px">实际路由: /pages/property/workflowManage?tab=流程管理</p></div><div class="modal-foot"><a class="btn light" onclick="closeModal()">取消</a><a class="btn" onclick="closeModal()">确认跳转</a></div></div></div>
<div class="modal-overlay" id="modal-delete"><div class="modal"><div class="modal-head"><span>确认删除</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body"><p>确定要删除吗？</p></div><div class="modal-foot"><a class="btn light" onclick="closeModal()">取消</a><a class="btn red" onclick="confirmDelete()">确认删除</a></div></div></div>

<script src="common.js"></script>
<script>
var allData=[{name:'厂房租赁合同',audit:'是',remark:'用于园区厂房租赁',time:'2026-01-15 10:30'},{name:'工程类合同',audit:'是',remark:'工程建设类合同',time:'2026-01-10 14:00'},{name:'服务合同',audit:'否',remark:'第三方服务合同',time:'2026-01-05 09:00'},{name:'补充协议',audit:'否',remark:'合同补充协议',time:'2026-01-01 11:00'}];
var filtered=[],page=1,ps=10,eIdx=-1,dIdx=-1;
function render(){var s=(page-1)*ps,pd=filtered.slice(s,s+ps),h='';pd.forEach(function(d,i){h+='<tr><td>'+d.name+'</td><td>'+d.audit+'</td><td>'+d.remark+'</td><td>'+d.time+'</td><td><a class="link" onclick="openSpecModal('+(s+i)+')">规格信息</a>　<a class="link" onclick="openTemplateModal('+(s+i)+')">模板</a>　<a class="link" onclick="openEdit('+(s+i)+')">编辑</a>　<a class="link red-text" onclick="openDel('+(s+i)+')">删除</a></td></tr>'});if(!pd.length)h='<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--muted)">暂无匹配数据</td></tr>';document.getElementById('tableBody').innerHTML=h;document.getElementById('totalCount').textContent=filtered.length;document.getElementById('pageNum').textContent=page}
function doFilter(){var nm=(document.getElementById('fName').value||'').toLowerCase(),au=document.getElementById('fAudit').value;filtered=allData.filter(function(d){return(!nm||d.name.toLowerCase().indexOf(nm)!==-1)&&(!au||d.audit===au)});page=1;render()}
function doReset(){document.getElementById('fName').value='';document.getElementById('fAudit').value='';doFilter()}
function prevPage(){if(page>1){page--;render()}}function nextPage(){if(page<Math.ceil(filtered.length/ps)){page++;render()}}function goToPage(){var p=parseInt(document.getElementById('goPage').value);if(p>=1&&p<=Math.ceil(filtered.length/ps)){page=p;render()}}
function openAdd(){eIdx=-1;document.getElementById('modalTitle').textContent='添加合同类型';document.getElementById('eName').value='';document.getElementById('eAudit').value='是';document.getElementById('eRemark').value='';openM('modal-edit')}
function openEdit(i){eIdx=i;var d=filtered[i];document.getElementById('modalTitle').textContent='编辑合同类型';document.getElementById('eName').value=d.name;document.getElementById('eAudit').value=d.audit;document.getElementById('eRemark').value=d.remark;openM('modal-edit')}
function save(){var nm=document.getElementById('eName').value.trim();if(!nm){toast('请输入类型名称','warn');return}var d={name:nm,audit:document.getElementById('eAudit').value,remark:document.getElementById('eRemark').value,time:new Date().toLocaleString('zh-CN').replace(/\//g,'-')};if(eIdx<0){allData.unshift(d);toast('合同类型已添加','ok')}else{Object.assign(filtered[eIdx],d);toast('已编辑','ok')}closeModal();doFilter()}
function openDel(i){dIdx=i;openM('modal-delete')}
function openAuditModal(){openM('modal-audit')}
function openSpecModal(i){var d=filtered[i];document.getElementById('specContent').innerHTML='<div class="kv"><div class="k">合同类型</div><div class="v">'+d.name+'</div><div class="k">审核</div><div class="v">'+d.audit+'</div><div class="k">规格字段</div><div class="v">合同金额、租赁面积、开始时间、结束时间</div><div class="k">模板绑定</div><div class="v">'+d.name+'标准模板</div></div>';openM('modal-spec')}
var templateAttrs=['#合同金额#','#租赁面积#','#开始时间#','#结束时间#','#甲方名称#','#乙方名称#','#租赁期限#','#付款方式#','#保证金#'];
function openTemplateModal(i){var d=filtered[i];var h='';templateAttrs.forEach(function(a){h+='<a class="btn light" style="padding:4px 12px;font-size:12px;cursor:pointer" onclick="insertAttr(\''+a+'\')">'+a+'</a>'});document.getElementById('attrButtons').innerHTML=h;document.getElementById('templateEditor').value='甲方（出租方）：#甲方名称#\n乙方（承租方）：#乙方名称#\n租赁面积：#租赁面积# ㎡\n合同金额：￥#合同金额# 元\n开始时间：#开始时间#\n结束时间：#结束时间#\n租赁期限：#租赁期限#\n付款方式：#付款方式#\n保证金：#保证金#\n\n备注条款：';openM('modal-template')}
function insertAttr(attr){var ta=document.getElementById('templateEditor');ta.value+=attr;ta.focus()}
function saveTemplate(){closeModal();toast('模板已保存','ok')}
function confirmDelete(){filtered.splice(dIdx,1);closeModal();doFilter();toast('已删除','warn')}
function openM(id){document.getElementById(id).classList.add('show')}function closeModal(){document.querySelectorAll('.modal-overlay.show').forEach(function(m){m.classList.remove('show')})}
function toast(msg,kind){var w=document.getElementById('toastWrap');var el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.textContent=msg;w.appendChild(el);requestAnimationFrame(function(){el.classList.add('show')});setTimeout(function(){el.classList.remove('show');setTimeout(function(){el.remove()},280)},2500)}
doFilter();document.addEventListener('click',function(e){if(e.target.classList.contains('modal-overlay')&&e.target.classList.contains('show'))e.target.classList.remove('show')});
</script>
</body></html>
