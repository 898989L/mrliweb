<body>
<header class="topbar"><div class="top-left"><div class="brand">盛源印花</div><nav class="top-menu"><span class="active">首页</span><span>业务受理</span><span>物联网</span><span>常用菜单</span><span>设置</span><span>搜索</span></nav></div><div class="top-user"><span>盛源印花产业园 <i class="chev"></i></span><span>测试2 <i class="chev"></i></span><span>v1.9</span></div></header>
<main class="layout"><aside class="primary-side"><a class="primary-item" href="01-厂房空间管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>房产</a><a class="primary-item" href="08-费用收缴概览.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>费用</a><a class="primary-item" href="09-资源授权.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>物联</a><a class="primary-item" href="11-巡检点管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>巡检</a><a class="primary-item active" href="16-合同类型管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>合同</a></aside>

<section class="workspace"><div class="toast-wrap" id="toastWrap"></div>
<section class="panel"><div class="panel-head"><span>内部合同管理</span><div class="btn-row"><a class="btn" href="19a-新增内部合同.html">起草</a></div></div><div class="panel-body">
<div class="filters"><div class="input"><input id="fName" placeholder="合同名称" style="border:0;outline:0;width:100%;background:transparent" oninput="doFilter()"></div><div class="input"><input id="fCode" placeholder="合同编号" style="border:0;outline:0;width:100%;background:transparent" oninput="doFilter()"></div><div class="select"><select id="fType" style="border:0;outline:0;width:100%;background:transparent;color:inherit" onchange="doFilter()"><option value="">合同类型</option><option>厂房租赁合同</option><option>服务合同</option></select></div><div></div><div></div><button class="btn" onclick="doFilter()">搜索</button><button class="btn gray" onclick="doReset()">重置</button></div>
<table style="min-width:1100px"><thead><tr><th>合同名称</th><th>合同编号</th><th>父合同编号</th><th>合同类型</th><th>经办人</th><th>合同金额</th><th>开始时间</th><th>结束时间</th><th>状态</th><th style="width:240px">操作</th></tr></thead><tbody id="tableBody"></tbody></table>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)"><span>共 <b id="totalCount">0</b> 条</span><div><span style="cursor:pointer" onclick="prevPage()">‹</span> <b id="pageNum">1</b> <span style="cursor:pointer" onclick="nextPage()">›</span></div><span>前往 <input style="width:40px;height:28px;border:1px solid var(--line);border-radius:4px;text-align:center" id="goPage" value="1" onkeydown="if(event.key==='Enter')goToPage()"> 页</span></div>
</div></section></section></main>

<div class="modal-overlay" id="modal-view"><div class="modal wide"><div class="modal-head"><span>合同详情</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body" id="viewContent"></div><div class="modal-foot"><a class="btn light" onclick="closeModal()">关闭</a></div></div></div>
<div class="modal-overlay" id="modal-edit"><div class="modal wide"><div class="modal-head"><span>编辑合同</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body">
  <div style="font-weight:800;font-size:14px;margin-bottom:16px">合同基本信息</div>
  <div class="filters" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:18px"><div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">合同名称</label><div class="input"><input id="eName" style="border:0;outline:0;width:100%;background:transparent"></div></div><div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">合同编号</label><div class="input"><input id="eCode" style="border:0;outline:0;width:100%;background:transparent"></div></div><div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">合同类型</label><div class="select"><select id="eType" style="border:0;outline:0;width:100%;background:transparent;color:inherit"><option>厂房租赁合同</option><option>服务合同</option></select></div></div></div>
  <div style="font-weight:800;font-size:14px;margin-bottom:16px">甲方信息</div>
  <div class="filters" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:18px"><div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">甲方</label><div class="input"><input id="ePartyA" style="border:0;outline:0;width:100%;background:transparent"></div></div><div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">甲方联系人</label><div class="input"><input id="eAContact" style="border:0;outline:0;width:100%;background:transparent"></div></div><div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">甲方电话</label><div class="input"><input id="eALink" style="border:0;outline:0;width:100%;background:transparent"></div></div></div>
  <div style="font-weight:800;font-size:14px;margin-bottom:16px">乙方信息</div>
  <div class="filters" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:18px"><div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">乙方</label><div class="input"><input id="ePartyB" style="border:0;outline:0;width:100%;background:transparent"></div></div><div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">乙方联系人</label><div class="input"><input id="eBContact" style="border:0;outline:0;width:100%;background:transparent"></div></div><div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">乙方电话</label><div class="input"><input id="eBLink" style="border:0;outline:0;width:100%;background:transparent"></div></div></div>
  <div style="font-weight:800;font-size:14px;margin-bottom:16px">合同详情</div>
  <div class="filters" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:18px"><div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">经办人</label><div class="input"><input id="eOper" style="border:0;outline:0;width:100%;background:transparent"></div></div><div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">合同金额</label><div class="input"><input id="eAmount" style="border:0;outline:0;width:100%;background:transparent"></div></div><div></div></div>
  <div class="filters" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:18px"><div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">开始时间</label><div class="input"><input id="eStart" style="border:0;outline:0;width:100%;background:transparent"></div></div><div><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">结束时间</label><div class="input"><input id="eEnd" style="border:0;outline:0;width:100%;background:transparent"></div></div><div></div></div>
</div><div class="modal-foot"><a class="btn light" onclick="closeModal()">取消</a><a class="btn" onclick="save()">保存</a></div></div></div>
<div class="modal-overlay" id="modal-delete"><div class="modal"><div class="modal-head"><span>确认删除</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body"><p>确定要删除该合同吗？</p></div><div class="modal-foot"><a class="btn light" onclick="closeModal()">取消</a><a class="btn red" onclick="confirmDelete()">确认删除</a></div></div></div>

<script src="common.js"></script>
<script>
var allData=[{name:'南昌博富服饰厂房租赁合同',code:'sy-034',pcode:'-',type:'厂房租赁合同',oper:'王政伟',amount:'294,808.50',start:'2025-03-10',end:'2027-09-30',state:'审核通过',partyA:'江西盛源产业运营服务有限公司',aContact:'王政伟',aLink:'138****6789',partyB:'南昌博富服饰',bContact:'张经理',bLink:'138****5678'},{name:'南昌宏发纺织品厂房租赁合同',code:'sy-033',pcode:'-',type:'厂房租赁合同',oper:'王政伟',amount:'315,600.00',start:'2025-02-15',end:'2027-08-15',state:'审核通过',partyA:'江西盛源产业运营服务有限公司',aContact:'王政伟',aLink:'138****6789',partyB:'南昌宏发纺织品',bContact:'李总',bLink:'139****8901'}];
var filtered=[],page=1,ps=10,eIdx=-1,dIdx=-1;
function render(){var s=(page-1)*ps,pd=filtered.slice(s,s+ps),h='';pd.forEach(function(d,i){h+='<tr><td>'+d.name+'</td><td>'+d.code+'</td><td>'+d.pcode+'</td><td>'+d.type+'</td><td>'+d.oper+'</td><td>'+d.amount+'</td><td>'+d.start+'</td><td>'+d.end+'</td><td><span class="status green">'+d.state+'</span></td><td><a class="link" onclick="openEdit('+(s+i)+')">编辑</a>　<a class="link red-text" onclick="openDel('+(s+i)+')">删除</a>　<a class="link" onclick="openView('+(s+i)+')">查看</a></td></tr>'});if(!pd.length)h='<tr><td colspan="10" style="text-align:center;padding:40px;color:var(--muted)">暂无匹配数据</td></tr>';document.getElementById('tableBody').innerHTML=h;document.getElementById('totalCount').textContent=filtered.length;document.getElementById('pageNum').textContent=page}
function doFilter(){var nm=(document.getElementById('fName').value||'').toLowerCase(),cd=(document.getElementById('fCode').value||'').toLowerCase(),tp=document.getElementById('fType').value;filtered=allData.filter(function(d){return(!nm||d.name.toLowerCase().indexOf(nm)!==-1)&&(!cd||d.code.toLowerCase().indexOf(cd)!==-1)&&(!tp||d.type===tp)});page=1;render()}function doReset(){document.getElementById('fName').value='';document.getElementById('fCode').value='';document.getElementById('fType').value='';doFilter()}
function prevPage(){if(page>1){page--;render()}}function nextPage(){if(page<Math.ceil(filtered.length/ps)){page++;render()}}function goToPage(){var p=parseInt(document.getElementById('goPage').value);if(p>=1&&p<=Math.ceil(filtered.length/ps)){page=p;render()}}
function openEdit(i){eIdx=i;var d=filtered[i];['eName','eCode','eType','ePartyA','eAContact','eALink','ePartyB','eBContact','eBLink','eOper','eAmount','eStart','eEnd'].forEach(function(id){document.getElementById(id).value=d[id]||''});openM('modal-edit')}
function openView(i){var d=filtered[i];document.getElementById('viewContent').innerHTML='<div style="font-weight:800;font-size:14px;margin-bottom:16px">合同基本信息</div><div class="filters" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:18px"><div><label style="font-weight:800;font-size:13px;color:#3a4a5c">合同名称</label><div style="margin-top:4px;color:#1f2d3d">'+d.name+'</div></div><div><label style="font-weight:800;font-size:13px;color:#3a4a5c">合同编号</label><div style="margin-top:4px;color:#1f2d3d">'+d.code+'</div></div><div><label style="font-weight:800;font-size:13px;color:#3a4a5c">合同类型</label><div style="margin-top:4px;color:#1f2d3d">'+d.type+'</div></div></div><div style="font-weight:800;font-size:14px;margin-bottom:16px">甲方信息</div><div class="filters" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:18px"><div><label style="font-weight:800;font-size:13px;color:#3a4a5c">甲方</label><div style="margin-top:4px;color:#1f2d3d">'+(d.partyA||'-')+'</div></div><div><label style="font-weight:800;font-size:13px;color:#3a4a5c">甲方联系人</label><div style="margin-top:4px;color:#1f2d3d">'+(d.aContact||'-')+'</div></div><div><label style="font-weight:800;font-size:13px;color:#3a4a5c">甲方电话</label><div style="margin-top:4px;color:#1f2d3d">'+(d.aLink||'-')+'</div></div></div><div style="font-weight:800;font-size:14px;margin-bottom:16px">乙方信息</div><div class="filters" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:18px"><div><label style="font-weight:800;font-size:13px;color:#3a4a5c">乙方</label><div style="margin-top:4px;color:#1f2d3d">'+(d.partyB||'-')+'</div></div><div><label style="font-weight:800;font-size:13px;color:#3a4a5c">乙方联系人</label><div style="margin-top:4px;color:#1f2d3d">'+(d.bContact||'-')+'</div></div><div><label style="font-weight:800;font-size:13px;color:#3a4a5c">乙方电话</label><div style="margin-top:4px;color:#1f2d3d">'+(d.bLink||'-')+'</div></div></div><div style="font-weight:800;font-size:14px;margin-bottom:16px">合同详情</div><div class="filters" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:18px"><div><label style="font-weight:800;font-size:13px;color:#3a4a5c">经办人</label><div style="margin-top:4px;color:#1f2d3d">'+d.oper+'</div></div><div><label style="font-weight:800;font-size:13px;color:#3a4a5c">合同金额</label><div style="margin-top:4px;color:#1f2d3d">'+d.amount+'</div></div><div></div></div><div class="filters" style="grid-template-columns:1fr 1fr;margin-bottom:18px"><div><label style="font-weight:800;font-size:13px;color:#3a4a5c">开始时间</label><div style="margin-top:4px;color:#1f2d3d">'+d.start+'</div></div><div><label style="font-weight:800;font-size:13px;color:#3a4a5c">结束时间</label><div style="margin-top:4px;color:#1f2d3d">'+d.end+'</div></div></div>';openM('modal-view')}
function save(){var nm=document.getElementById('eName').value.trim();if(!nm){toast('请输入合同名称','warn');return}var map={name:'eName',code:'eCode',type:'eType',partyA:'ePartyA',aContact:'eAContact',aLink:'eALink',partyB:'ePartyB',bContact:'eBContact',bLink:'eBLink',oper:'eOper',amount:'eAmount',start:'eStart',end:'eEnd'};for(var k in map)filtered[eIdx][k]=document.getElementById(map[k]).value;closeModal();doFilter();toast('已编辑','ok')}
function openDel(i){dIdx=i;openM('modal-delete')}function confirmDelete(){filtered.splice(dIdx,1);closeModal();doFilter();toast('已删除','warn')}
function openM(id){document.getElementById(id).classList.add('show')}function closeModal(){document.querySelectorAll('.modal-overlay.show').forEach(function(m){m.classList.remove('show')})}
function toast(msg,kind){var w=document.getElementById('toastWrap');var el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.textContent=msg;w.appendChild(el);requestAnimationFrame(function(){el.classList.add('show')});setTimeout(function(){el.classList.remove('show');setTimeout(function(){el.remove()},280)},2500)}
doFilter();document.addEventListener('click',function(e){if(e.target.classList.contains('modal-overlay')&&e.target.classList.contains('show'))e.target.classList.remove('show')});
</script>
</body></html>
