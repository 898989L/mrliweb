<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>巡检项目管理</title><link rel="stylesheet" href="common.css" /></head>
<body>
<header class="topbar"><div class="top-left"><div class="brand">盛源印花</div><nav class="top-menu"><span class="active">首页</span><span>业务受理</span><span>物联网</span><span>常用菜单</span><span>设置</span><span>搜索</span></nav></div><div class="top-user"><span>盛源印花产业园 <i class="chev"></i></span><span>测试2 <i class="chev"></i></span><span>v1.9</span></div></header>
<main class="layout"><aside class="primary-side"><a class="primary-item" href="01-厂房空间管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>房产</a><a class="primary-item" href="08-费用收缴概览.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>费用</a><a class="primary-item" href="09-资源授权.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>物联</a><a class="primary-item active" href="11-巡检点管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>巡检</a><a class="primary-item" href="16-合同类型管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>合同</a></aside>
<aside class="sub-side"><div class="sub-title">巡检管理</div><a class="sub-item active" href="15-巡检项目管理.html">巡检项目</a><a class="sub-item" href="11-巡检点管理.html">巡检点</a><a class="sub-item" href="25-巡检路线管理.html">巡检路线</a><a class="sub-item" href="12-巡检计划管理.html">巡检计划</a><a class="sub-item" href="13-巡检任务管理.html">巡检任务</a><a class="sub-item" href="14-巡检明细.html">巡检明细</a><a class="sub-item" href="24-巡检报表.html">巡检报表</a></aside>
<section class="workspace"><div class="toast-wrap" id="toastWrap"></div>
<section class="panel"><div class="panel-head"><span>巡检项目管理</span><div class="btn-row"><a class="btn" onclick="openAdd()">＋ 添加</a></div></div><div class="panel-body">
<div class="filters"><div class="input"><input id="fId" placeholder="项目编号" style="border:0;outline:0;width:100%;background:transparent" oninput="doFilter()"></div><div class="input"><input id="fName" placeholder="项目名称" style="border:0;outline:0;width:100%;background:transparent" oninput="doFilter()"></div><div></div><div></div><div></div><button class="btn" onclick="doFilter()">搜索</button><button class="btn gray" onclick="doReset()">重置</button></div>
<table><thead><tr><th>编号</th><th>巡检项目</th><th>创建时间</th><th>备注</th><th style="width:220px">操作</th></tr></thead><tbody id="tableBody"></tbody></table>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)"><span>共 <b id="totalCount">0</b> 条</span><div><span style="cursor:pointer" onclick="prevPage()">‹</span> <b id="pageNum">1</b> <span style="cursor:pointer" onclick="nextPage()">›</span></div><span>前往 <input style="width:40px;height:28px;border:1px solid var(--line);border-radius:4px;text-align:center" id="goPage" value="1" onkeydown="if(event.key==='Enter')goToPage()"> 页</span></div>
</div></section></section></main>

<div class="modal-overlay" id="modal-edit"><div class="modal"><div class="modal-head"><span id="modalTitle">添加巡检项目</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body">
  <div style="margin-bottom:14px"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">项目名称</label><div class="input"><input id="eName" style="border:0;outline:0;width:100%;background:transparent" placeholder="请输入项目名称"></div></div>
  <div style="margin-bottom:14px"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">备注</label><textarea id="eRemark" style="width:100%;height:70px;resize:vertical;border:1px solid #d7dfeb;border-radius:4px;padding:10px 15px;font-size:14px;font-family:inherit;color:#1f2d3d;outline:none;line-height:1.6" placeholder="请输入备注"></textarea></div>
</div><div class="modal-foot"><a class="btn light" onclick="closeModal()">取消</a><a class="btn" onclick="save()">保存</a></div></div></div>

<div class="modal-overlay" id="modal-delete"><div class="modal"><div class="modal-head"><span>确认删除</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body"><p>确定要删除巡检项目「<b id="delName"></b>」吗？</p></div><div class="modal-foot"><a class="btn light" onclick="closeModal()">取消</a><a class="btn red" onclick="confirmDelete()">确认删除</a></div></div></div>

<script src="common.js"></script>
<script>
var allData=[{id:'102026040737860337',name:'变压器巡检',time:'2026-04-07 16:32:37',remark:'变压器'},{id:'102026040788250266',name:'污水处理厂巡检',time:'2026-04-07 16:26:38',remark:'污水处理厂'},{id:'102026040778450245',name:'监控巡检',time:'2026-04-07 16:25:35',remark:'监控'},{id:'102026040758220239',name:'电梯巡检',time:'2026-04-07 16:25:05',remark:'电梯'},{id:'102026040769970215',name:'气膜设备巡检',time:'2026-04-07 16:23:50',remark:'气膜设备'},{id:'102026040765760194',name:'每月15日柴油发电机测试巡检',time:'2026-04-07 16:22:15',remark:'每月15日柴油发电机测试'}];
var filtered=[],page=1,ps=10,eIdx=-1,dIdx=-1;
function render(){var s=(page-1)*ps,pd=filtered.slice(s,s+ps),h='';pd.forEach(function(d,i){h+='<tr><td>'+d.id+'</td><td>'+d.name+'</td><td>'+d.time+'</td><td>'+d.remark+'</td><td><a class="link" onclick="openEdit('+(s+i)+')">编辑</a>　<a class="link red-text" onclick="openDel('+(s+i)+')">删除</a>　<a class="link green-text" href="26-检查项管理.html?item='+encodeURIComponent(d.name)+'">题目</a></td></tr>'});if(!pd.length)h='<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--muted)">暂无匹配数据</td></tr>';document.getElementById('tableBody').innerHTML=h;document.getElementById('totalCount').textContent=filtered.length;document.getElementById('pageNum').textContent=page}
function doFilter(){var id=(document.getElementById('fId').value||'').toLowerCase(),nm=(document.getElementById('fName').value||'').toLowerCase();filtered=allData.filter(function(d){return(!id||d.id.toLowerCase().indexOf(id)!==-1)&&(!nm||d.name.toLowerCase().indexOf(nm)!==-1)});page=1;render()}
function doReset(){document.getElementById('fId').value='';document.getElementById('fName').value='';doFilter()}
function prevPage(){if(page>1){page--;render()}}function nextPage(){if(page<Math.ceil(filtered.length/ps)){page++;render()}}function goToPage(){var p=parseInt(document.getElementById('goPage').value);if(p>=1&&p<=Math.ceil(filtered.length/ps)){page=p;render()}}
function openAdd(){eIdx=-1;document.getElementById('modalTitle').textContent='添加巡检项目';document.getElementById('eName').value='';document.getElementById('eRemark').value='';openM('modal-edit')}
function openEdit(i){eIdx=i;var d=filtered[i];document.getElementById('modalTitle').textContent='编辑巡检项目';document.getElementById('eName').value=d.name;document.getElementById('eRemark').value=d.remark;openM('modal-edit')}
function save(){var nm=document.getElementById('eName').value.trim();if(!nm){toast('请输入项目名称','warn');return}var d={id:'10202604'+String(Date.now()).slice(-9),name:nm,time:new Date().toLocaleString('zh-CN').replace(/\//g,'-'),remark:document.getElementById('eRemark').value};if(eIdx<0){allData.unshift(d);toast('巡检项目已添加','ok')}else{Object.assign(filtered[eIdx],d);toast('已编辑','ok')}closeModal();doFilter()}
function openDel(i){dIdx=i;document.getElementById('delName').textContent=filtered[i].name;openM('modal-delete')}
function confirmDelete(){var d=filtered[dIdx];allData=allData.filter(function(x){return x.id!==d.id});closeModal();doFilter();toast('已删除','warn')}
function openM(id){document.getElementById(id).classList.add('show')}
function closeModal(){document.querySelectorAll('.modal-overlay.show').forEach(function(m){m.classList.remove('show')})}
function toast(msg,kind){var w=document.getElementById('toastWrap');var el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.textContent=msg;w.appendChild(el);requestAnimationFrame(function(){el.classList.add('show')});setTimeout(function(){el.classList.remove('show');setTimeout(function(){el.remove()},280)},2500)}
doFilter();document.addEventListener('click',function(e){if(e.target.classList.contains('modal-overlay')&&e.target.classList.contains('show'))e.target.classList.remove('show')});
</script>
</body></html>
