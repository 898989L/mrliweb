<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>到期合同管理</title><link rel="stylesheet" href="common.css" /></head>
<body>
<header class="topbar"><div class="top-left"><div class="brand">盛源印花</div><nav class="top-menu"><span class="active">首页</span><span>业务受理</span><span>物联网</span><span>常用菜单</span><span>设置</span><span>搜索</span></nav></div><div class="top-user"><span>盛源印花产业园 <i class="chev"></i></span><span>测试2 <i class="chev"></i></span><span>v1.9</span></div></header>
<main class="layout"><aside class="primary-side"><a class="primary-item" href="01-厂房空间管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>房产</a><a class="primary-item" href="08-费用收缴概览.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>费用</a><a class="primary-item" href="09-资源授权.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>物联</a><a class="primary-item" href="11-巡检点管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>巡检</a><a class="primary-item active" href="16-合同类型管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>合同</a></aside>
<aside class="sub-side"><div class="sub-title">合同管理</div><a class="sub-item" href="16-合同类型管理.html">合同类型</a><a class="sub-item" href="17-合同甲方管理.html">合同甲方</a><a class="sub-item" href="18-起草合同管理.html">起草合同</a><a class="sub-item" href="19-内部合同管理.html">内部合同</a><a class="sub-item" href="20-合同查询.html">合同查询</a><a class="sub-item" href="21-外部合同管理.html">外部合同</a><a class="sub-item" href="22-合同变更管理.html">合同变更</a><a class="sub-item active" href="23-到期合同管理.html">到期合同</a></aside>
<section class="workspace"><div class="toast-wrap" id="toastWrap"></div>
<section class="panel"><div class="panel-head"><span>到期合同管理</span></div><div class="panel-body">
<div class="filters"><div class="input"><input id="fName" placeholder="合同名称" style="border:0;outline:0;width:100%;background:transparent" oninput="doFilter()"></div><div class="input"><input id="fCode" placeholder="合同编号" style="border:0;outline:0;width:100%;background:transparent" oninput="doFilter()"></div><div class="select"><select id="fType" style="border:0;outline:0;width:100%;background:transparent;color:inherit" onchange="doFilter()"><option value="">合同类型</option><option>工程类合同</option></select></div><div></div><div></div><button class="btn" onclick="doFilter()">搜索</button><button class="btn gray" onclick="doReset()">重置</button></div>
<table style="min-width:1400px"><thead><tr><th>合同名称</th><th>合同编号</th><th>合同类型</th><th>甲方</th><th>乙方</th><th>经办人</th><th>合同金额</th><th>开始时间</th><th>结束时间</th><th>状态</th><th style="width:140px">操作</th></tr></thead><tbody id="tableBody"></tbody></table>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)"><span>共 <b id="totalCount">0</b> 条</span><div><span style="cursor:pointer" onclick="prevPage()">‹</span> <b id="pageNum">1</b> <span style="cursor:pointer" onclick="nextPage()">›</span></div><span>前往 <input style="width:40px;height:28px;border:1px solid var(--line);border-radius:4px;text-align:center" id="goPage" value="1" onkeydown="if(event.key==='Enter')goToPage()"> 页</span></div>
</div></section></section></main>
<div class="modal-overlay" id="modal-stop"><div class="modal"><div class="modal-head"><span>确认终止</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body"><p>确定要终止合同「<b id="stopName"></b>」吗？</p></div><div class="modal-foot"><a class="btn light" onclick="closeModal()">取消</a><a class="btn red" onclick="confirmStop()">确认终止</a></div></div></div>
<script src="common.js"></script>
<script>
var allData=[{name:'挖机租赁协议',code:'工程-34',type:'工程类合同',partyA:'江西盛源产业运营服务有限公司',partyB:'江西徐日标建筑工程',oper:'熊剑',amount:'18,810.00',start:'2024-08-21',end:'2024-09-20',state:'审核通过'},{name:'AAC加砌块采购合同',code:'JJH-SY20241126-01',type:'工程类合同',partyA:'江西盛源产业运营服务有限公司',partyB:'江西嘉佳和装配式建筑',oper:'熊剑',amount:'128,600.00',start:'2024-11-26',end:'2024-12-25',state:'审核通过'}];
var filtered=[],page=1,ps=10,dIdx=-1;
function render(){var s=(page-1)*ps,pd=filtered.slice(s,s+ps),h='';pd.forEach(function(d,i){h+='<tr><td>'+d.name+'</td><td>'+d.code+'</td><td>'+d.type+'</td><td>'+d.partyA+'</td><td>'+d.partyB+'</td><td>'+d.oper+'</td><td>'+d.amount+'</td><td>'+d.start+'</td><td>'+d.end+'</td><td><span class="status green">'+d.state+'</span></td><td><a class="link" href="18a-起草合同.html">续签</a>　<a class="link red-text" onclick="openStop('+(s+i)+')">终止</a></td></tr>'});if(!pd.length)h='<tr><td colspan="11" style="text-align:center;padding:40px;color:var(--muted)">暂无匹配数据</td></tr>';document.getElementById('tableBody').innerHTML=h;document.getElementById('totalCount').textContent=filtered.length;document.getElementById('pageNum').textContent=page}
function doFilter(){var nm=(document.getElementById('fName').value||'').toLowerCase(),cd=(document.getElementById('fCode').value||'').toLowerCase(),tp=document.getElementById('fType').value;filtered=allData.filter(function(d){return(!nm||d.name.toLowerCase().indexOf(nm)!==-1)&&(!cd||d.code.toLowerCase().indexOf(cd)!==-1)&&(!tp||d.type===tp)});page=1;render()}function doReset(){document.getElementById('fName').value='';document.getElementById('fCode').value='';document.getElementById('fType').value='';doFilter()}
function prevPage(){if(page>1){page--;render()}}function nextPage(){if(page<Math.ceil(filtered.length/ps)){page++;render()}}function goToPage(){var p=parseInt(document.getElementById('goPage').value);if(p>=1&&p<=Math.ceil(filtered.length/ps)){page=p;render()}}
function openStop(i){dIdx=i;document.getElementById('stopName').textContent=filtered[i].name;openM('modal-stop')}
function confirmStop(){filtered.splice(dIdx,1);closeModal();doFilter();toast('合同已终止','warn')}
function openM(id){document.getElementById(id).classList.add('show')}function closeModal(){document.querySelectorAll('.modal-overlay.show').forEach(function(m){m.classList.remove('show')})}
function toast(msg,kind){var w=document.getElementById('toastWrap');var el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.textContent=msg;w.appendChild(el);requestAnimationFrame(function(){el.classList.add('show')});setTimeout(function(){el.classList.remove('show');setTimeout(function(){el.remove()},280)},2500)}
doFilter();document.addEventListener('click',function(e){if(e.target.classList.contains('modal-overlay')&&e.target.classList.contains('show'))e.target.classList.remove('show')});
</script>
</body></html>
