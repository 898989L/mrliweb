<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>新增巡检计划</title><link rel="stylesheet" href="common.css" />
<style>
.form-card{background:#fff;padding:28px 32px;border:1px solid var(--line);border-radius:6px;max-width:960px;margin:0 auto}
.staff-select{border:1px solid #d7dfeb;border-radius:4px;padding:8px 12px;min-height:44px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;cursor:pointer}
.staff-select .tag{display:inline-flex;align-items:center;gap:4px;background:#eef5ff;color:var(--blue-deep);padding:3px 8px;border-radius:4px;font-size:12px;font-weight:800}
.staff-select .tag .remove{cursor:pointer;font-size:14px;line-height:1;opacity:.6}
.staff-select .tag .remove:hover{opacity:1}
.staff-select .placeholder{color:#9aa4b5}
.staff-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.1);z-index:10;max-height:200px;overflow-y:auto;display:none}
.staff-dropdown.show{display:block}
.staff-dropdown .item{padding:8px 14px;cursor:pointer;font-size:13px;transition:.1s}
.staff-dropdown .item:hover{background:#f0f5ff}
.staff-wrapper{position:relative}
.org-item{padding:8px 10px;cursor:pointer;border-radius:4px;font-size:13px;transition:.1s}
.org-item:hover{background:#f0f5ff}
.org-item.active{background:#eaf2ff;color:var(--blue-deep);font-weight:800}
.staff-item{padding:10px 12px;border:1px solid #e8ecf2;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:.1s}
.staff-item:hover{border-color:var(--blue);background:#f8faff}
.staff-item.selected{background:#eef5ff;border-color:var(--blue);font-weight:800}
.staff-item .name{font-size:14px}
.staff-item .dept{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header class="topbar"><div class="top-left"><div class="brand">盛源印花</div><nav class="top-menu"><span class="active">首页</span><span>业务受理</span><span>物联网</span><span>常用菜单</span><span>设置</span><span>搜索</span></nav></div><div class="top-user"><span>盛源印花产业园 <i class="chev"></i></span><span>测试2 <i class="chev"></i></span><span>v1.9</span></div></header>
<main class="layout"><aside class="primary-side"><a class="primary-item" href="01-厂房空间管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>房产</a><a class="primary-item" href="08-费用收缴概览.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>费用</a><a class="primary-item" href="09-资源授权.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>物联</a><a class="primary-item active" href="11-巡检点管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>巡检</a><a class="primary-item" href="16-合同类型管理.html"><span class="grid-icon"><span></span><span></span><span></span><span></span></span>合同</a></aside>
<aside class="sub-side"><div class="sub-title">巡检管理</div><a class="sub-item" href="15-巡检项目管理.html">巡检项目</a><a class="sub-item" href="11-巡检点管理.html">巡检点</a><a class="sub-item" href="25-巡检路线管理.html">巡检路线</a><a class="sub-item active" href="12-巡检计划管理.html">巡检计划</a><a class="sub-item" href="13-巡检任务管理.html">巡检任务</a><a class="sub-item" href="14-巡检明细.html">巡检明细</a><a class="sub-item" href="24-巡检报表.html">巡检报表</a></aside>
<section class="workspace"><div class="toast-wrap" id="toastWrap"></div>
<section class="panel"><div class="panel-head"><span>新增巡检计划</span><div class="btn-row"><a class="btn light" href="12-巡检计划管理.html">← 返回列表</a></div></div><div class="panel-body">
<div class="form-card">

  <div style="display:flex;gap:20px;margin-bottom:18px">
    <div style="flex:1"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">计划名称</label><div class="input"><input id="eName" style="border:0;outline:0;width:100%;background:transparent" placeholder="请输入计划名称"></div></div>
    <div style="flex:1"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">巡检路线</label><div class="select"><select id="eRoute" style="border:0;outline:0;width:100%;background:transparent;color:inherit"><option value="">请选择路线</option><option>每月15日柴油发电机测试</option><option>气膜设备</option><option>电梯</option><option>监控设备</option><option>变压器巡检</option><option>污水处理厂</option></select></div></div>
  </div>

  <div style="display:flex;gap:20px;margin-bottom:18px">
    <div style="flex:1"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">计划周期</label><div class="select"><select id="ePeriod" style="border:0;outline:0;width:100%;background:transparent;color:inherit" onchange="onPeriodChange()"><option value="">请选择周期</option><option value="2020023">按周</option><option value="2020022">按月</option></select></div></div>
    <div style="flex:1"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">任务提前</label><div style="display:flex;align-items:center;gap:8px"><div class="input" style="flex:1"><input id="eAdvance" type="number" style="border:0;outline:0;width:100%;background:transparent" value="15"></div><span style="font-size:13px;color:var(--muted);white-space:nowrap">分钟生成</span></div></div>
  </div>

  <div id="periodWeek" style="display:none;margin-bottom:18px"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:8px">选择星期</label><div style="display:flex;flex-wrap:wrap;gap:6px" id="weekChecks"></div></div>

  <div id="periodMonth" style="display:none;margin-bottom:18px">
    <label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:8px">选择月份</label><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px" id="monthChecks"></div>
    <label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:8px">选择日期</label><div style="display:flex;flex-wrap:wrap;gap:6px" id="dayChecks"></div>
  </div>

  <div style="display:flex;gap:20px;margin-bottom:18px">
    <div style="flex:1"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">开始日期</label><div class="input"><input id="eStart" style="border:0;outline:0;width:100%;background:transparent" value="2026-01-01"></div></div>
    <div style="flex:1"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">结束日期</label><div class="input"><input id="eEnd" style="border:0;outline:0;width:100%;background:transparent" value="2026-12-31"></div></div>
  </div>

  <div style="display:flex;gap:20px;margin-bottom:18px">
    <div style="flex:1"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">开始时间</label><div class="input"><input id="eStartTime" style="border:0;outline:0;width:100%;background:transparent" value="08:00"></div></div>
    <div style="flex:1"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">结束时间</label><div class="input"><input id="eEndTime" style="border:0;outline:0;width:100%;background:transparent" value="18:00"></div></div>
  </div>

  <div style="display:flex;gap:20px;margin-bottom:18px">
    <div style="flex:1"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">签到方式</label><div class="select"><select id="eSign" style="border:0;outline:0;width:100%;background:transparent;color:inherit"><option>现场拍照</option><option>NFC签到</option><option>扫码签到</option></select></div></div>
    <div style="flex:1"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">巡检人员</label>
      <div class="staff-wrapper">
        <div class="staff-select" id="staffBox" onclick="openStaffDialog()">
          <span class="placeholder" id="staffPlaceholder">请选择巡检人员</span>
        </div>
      </div>
    </div>
  </div>

  <div style="margin-bottom:24px"><label style="display:block;font-weight:800;font-size:13px;color:#3a4a5c;margin-bottom:6px">备注</label><textarea id="eRemark" style="width:100%;height:80px;resize:vertical;border:1px solid #d7dfeb;border-radius:4px;padding:10px 15px;font-size:14px;font-family:inherit;color:#1f2d3d;outline:none;line-height:1.6" placeholder="请输入备注信息"></textarea></div>

  <div style="display:flex;gap:10px">
    <a class="btn" style="flex:1" onclick="save()">保存</a>
    <a class="btn light" style="flex:1" href="12-巡检计划管理.html">取消</a>
  </div>

<!-- 选择员工弹窗 -->
<div class="modal-overlay" id="modal-staff"><div class="modal wide"><div class="modal-head"><span>选择巡检人员</span><button class="modal-close" onclick="closeStaffDialog()">&times;</button></div><div class="modal-body">
  <div style="display:flex;gap:20px;min-height:360px">
    <div style="width:200px;border-right:1px solid var(--line);padding-right:14px;overflow-y:auto;max-height:360px">
      <div style="font-weight:800;font-size:13px;margin-bottom:10px">组织架构</div>
      <div class="org-item active" onclick="selectOrg('盛源印花产业园')">🏢 盛源印花产业园</div>
      <div class="org-item" onclick="selectOrg('运维部')" style="margin-left:12px">👥 运维部</div>
      <div class="org-item" onclick="selectOrg('工程部')" style="margin-left:12px">👥 工程部</div>
      <div class="org-item" onclick="selectOrg('行政部')" style="margin-left:12px">👥 行政部</div>
    </div>
    <div style="flex:1;overflow-y:auto;max-height:360px">
      <div style="font-weight:800;font-size:13px;margin-bottom:10px">人员列表 <span style="font-weight:400;color:var(--muted);font-size:12px">（点击选中/取消选中）</span></div>
      <div id="staffList" style="display:flex;flex-direction:column;gap:4px"></div>
    </div>
  </div>
</div><div class="modal-foot"><a class="btn light" onclick="closeStaffDialog()">取消</a><a class="btn" onclick="confirmStaff()">确认选择 <span id="staffCount" style="font-weight:400">(0人)</span></a></div></div></div>

</div></div></section></section></main>
<script src="common.js"></script>
<script>
var selWeeks=[],selMonths=[],selDays=[],selStaffs=[];
function onPeriodChange(){
  var v=document.getElementById('ePeriod').value;
  document.getElementById('periodWeek').style.display=v==='2020023'?'':'none';
  document.getElementById('periodMonth').style.display=v==='2020022'?'':'none';
  if(v==='2020023')renderWeekChecks();
  if(v==='2020022')renderMonthDayChecks();
}
function renderWeekChecks(){
  var days=['周一','周二','周三','周四','周五','周六','周日'],h='';
  days.forEach(function(d,i){h+='<label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:4px 8px;border:1px solid #d7dfeb;border-radius:4px;cursor:pointer;background:'+(selWeeks.indexOf(i+1)>=0?'#eef5ff':'#fff')+'"><input type="checkbox" value="'+(i+1)+'"'+(selWeeks.indexOf(i+1)>=0?' checked':'')+' onchange="toggleWeek('+(i+1)+',this.checked)" style="accent-color:var(--blue)">'+d+'</label>'});
  document.getElementById('weekChecks').innerHTML=h;
}
function toggleWeek(v,ck){if(ck)selWeeks.push(v);else selWeeks=selWeeks.filter(function(x){return x!==v});renderWeekChecks()}
function renderMonthDayChecks(){
  var mh='';for(var i=1;i<=12;i++)mh+='<label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:4px 8px;border:1px solid #d7dfeb;border-radius:4px;cursor:pointer;background:'+(selMonths.indexOf(i)>=0?'#eef5ff':'#fff')+'"><input type="checkbox" value="'+i+'"'+(selMonths.indexOf(i)>=0?' checked':'')+' onchange="toggleMonth('+i+',this.checked)" style="accent-color:var(--blue)">'+i+'月</label>';
  document.getElementById('monthChecks').innerHTML=mh;
  var dh='';for(var i=1;i<=31;i++)dh+='<label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:4px 8px;border:1px solid #d7dfeb;border-radius:4px;cursor:pointer;background:'+(selDays.indexOf(i)>=0?'#eef5ff':'#fff')+'"><input type="checkbox" value="'+i+'"'+(selDays.indexOf(i)>=0?' checked':'')+' onchange="toggleDay('+i+',this.checked)" style="accent-color:var(--blue)">'+i+'日</label>';
  document.getElementById('dayChecks').innerHTML=dh;
}
function toggleMonth(v,ck){if(ck)selMonths.push(v);else selMonths=selMonths.filter(function(x){return x!==v});renderMonthDayChecks()}
function toggleDay(v,ck){if(ck)selDays.push(v);else selDays=selDays.filter(function(x){return x!==v});renderMonthDayChecks()}

// 员工选择 - 弹窗式
var allStaffByOrg={'盛源印花产业园':[{name:'测试2',dept:'运维部'},{name:'测试3',dept:'运维部'},{name:'测试4',dept:'工程部'},{name:'王政伟',dept:'行政部'},{name:'熊剑',dept:'工程部'},{name:'章琼',dept:'行政部'},{name:'万俊伟',dept:'工程部'}],'运维部':[{name:'测试2',dept:'运维部'},{name:'测试3',dept:'运维部'}],'工程部':[{name:'测试4',dept:'工程部'},{name:'熊剑',dept:'工程部'},{name:'万俊伟',dept:'工程部'}],'行政部':[{name:'王政伟',dept:'行政部'},{name:'章琼',dept:'行政部'}]};
var dialogSelStaffs=[];
function openStaffDialog(){dialogSelStaffs=selStaffs.slice();renderStaffList('盛源印花产业园');document.getElementById('staffCount').textContent='('+dialogSelStaffs.length+'人)';document.getElementById('modal-staff').classList.add('show')}
function closeStaffDialog(){document.getElementById('modal-staff').classList.remove('show')}
function selectOrg(org){document.querySelectorAll('.org-item').forEach(function(e){e.classList.toggle('active',e.textContent.trim().indexOf(org)>=0)});renderStaffList(org)}
function renderStaffList(org){
  var staffs=allStaffByOrg[org]||allStaffByOrg['盛源印花产业园'],h='';
  staffs.forEach(function(s){h+='<div class="staff-item'+(dialogSelStaffs.indexOf(s.name)>=0?' selected':'')+'" onclick="toggleDialogStaff(\''+s.name+'\')"><span class="name">'+s.name+'</span><span class="dept">'+s.dept+'</span></div>'});
  document.getElementById('staffList').innerHTML=h;
}
function toggleDialogStaff(name){var i=dialogSelStaffs.indexOf(name);if(i>=0)dialogSelStaffs.splice(i,1);else dialogSelStaffs.push(name);document.getElementById('staffCount').textContent='('+dialogSelStaffs.length+'人)';var org=document.querySelector('.org-item.active');if(org)renderStaffList(org.textContent.trim())}
function confirmStaff(){selStaffs=dialogSelStaffs.slice();renderStaffs();closeStaffDialog()}
function removeStaff(name){selStaffs=selStaffs.filter(function(s){return s!==name});renderStaffs()}
function renderStaffs(){
  var box=document.getElementById('staffBox'),ph=document.getElementById('staffPlaceholder');
  box.querySelectorAll('.tag').forEach(function(t){t.remove()});
  if(selStaffs.length){ph.style.display='none';var tags='';selStaffs.forEach(function(s){tags+='<span class="tag">'+s+'<span class="remove" onclick="event.stopPropagation();removeStaff(\''+s+'\')">&times;</span></span>'});box.insertAdjacentHTML('beforeend',tags)}
  else{ph.style.display=''}
}

function save(){
  var nm=document.getElementById('eName').value.trim();if(!nm){alert('请输入计划名称');return}
  var rt=document.getElementById('eRoute').value;if(!rt){alert('请选择路线');return}
  var pr=document.getElementById('ePeriod').value;if(!pr){alert('请选择周期');return}
  var d={id:'JH'+new Date().getTime().toString().slice(-5),name:nm,route:rt,period:pr,periodName:pr==='2020023'?'按周':'按月',weeks:selWeeks,months:selMonths,days:selDays,sign:document.getElementById('eSign').value,start:document.getElementById('eStart').value,end:document.getElementById('eEnd').value,startTime:document.getElementById('eStartTime').value,endTime:document.getElementById('eEndTime').value,advance:document.getElementById('eAdvance').value,creator:'测试2',ctime:new Date().toISOString().slice(0,10),state:'启用',staffs:selStaffs,remark:document.getElementById('eRemark').value};
  sessionStorage.setItem('newPlan',JSON.stringify(d));
  location.href='12-巡检计划管理.html';
}
</script>
</body></html>
