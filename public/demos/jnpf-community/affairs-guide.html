  <style>
    .cat-tabs {
      display: flex;
      overflow-x: auto;
      padding: 0 12px;
      background: white;
      border-bottom: 1px solid var(--color-divider);
      gap: 4px;
    }
    .cat-tab {
      padding: 12px 14px;
      font-size: 14px;
      color: var(--color-text-sub);
      position: relative;
      cursor: pointer;
      white-space: nowrap;
    }
    .cat-tab.active {
      color: var(--color-primary);
      font-weight: 600;
    }
    .cat-tab.active::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
      background: var(--color-primary);
      border-radius: 2px;
    }

    .guide-item {
      background: white;
      padding: 14px 16px;
      margin-bottom: 8px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .guide-item .icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .guide-item .icon-wrap svg { width: 20px; height: 20px; }
    .guide-item .body {
      flex: 1;
      min-width: 0;
    }
    .guide-item .name {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .guide-item .meta {
      font-size: 12px;
      color: var(--color-text-weak);
    }
    .ic-blue   { background: var(--color-primary-bg); color: var(--color-primary); }
    .ic-orange { background: var(--color-orange-bg);  color: var(--color-orange); }
    .ic-cyan   { background: var(--color-cyan-bg);    color: var(--color-cyan); }
    .ic-pink   { background: var(--color-pink-bg);    color: var(--color-pink); }
    .ic-red    { background: var(--color-red-bg);     color: var(--color-red); }
    .ic-purple { background: var(--color-purple-bg);  color: var(--color-purple); }
    .ic-green  { background: var(--color-green-bg);   color: var(--color-green); }
    .ic-gray   { background: var(--color-gray-bg);    color: var(--color-gray); }
  </style>
</head>

  <script>
    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });
