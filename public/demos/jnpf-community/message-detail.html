<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧社区 - 消息详情</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .msg-header {
      background: white;
      padding: 20px 16px;
      text-align: center;
      border-bottom: 1px solid var(--color-divider);
    }
    .msg-header .icon-big {
      width: 60px;
      height: 60px;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .msg-header .icon-big svg { width: 30px; height: 30px; }
    .msg-header .title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .msg-header .time {
      font-size: 12px;
      color: var(--color-text-weak);
    }
    .msg-body {
      background: white;
      padding: 20px 16px;
      margin-top: 8px;
      font-size: 15px;
      line-height: 1.8;
      color: var(--color-text);
    }
    .msg-body p {
      margin-bottom: 10px;
    }
    .msg-body .highlight {
      background: var(--color-primary-bg);
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin: 12px 0;
      color: var(--color-text);
      line-height: 2;
    }
    .msg-body .highlight svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 3px; }
    .msg-body .action-row {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }
  </style>
</head>
