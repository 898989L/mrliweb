<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧社区 - 志愿者服务</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .volunteer-hero {
      margin: 12px;
      padding: 24px 20px;
      background: linear-gradient(135deg, #00b578, #4ddba6);
      color: white;
      border-radius: 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .volunteer-hero::before {
      content: '';
      position: absolute;
      right: -30px;
      top: -30px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
      border-radius: 50%;
    }
    .volunteer-hero .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .volunteer-hero .subtitle {
      font-size: 13px;
      opacity: 0.95;
      line-height: 1.6;
    }
    .volunteer-hero .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    .volunteer-hero .stat-num {
      font-size: 22px;
      font-weight: 700;
    }
    .volunteer-hero .stat-label {
      font-size: 11px;
      opacity: 0.9;
      margin-top: 2px;
    }

    .direction-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 12px;
    }
    .direction-item {
      background: white;
      padding: 16px 8px;
      border-radius: 12px;
      text-align: center;
    }
    .direction-item .icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 6px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .direction-item .icon svg { width: 22px; height: 22px; }
    .direction-item .icon.dir-orange { background: linear-gradient(135deg, #ff9500, #ffb049); }
    .direction-item .icon.dir-cyan { background: linear-gradient(135deg, #13c2c2, #36cfc9); }
    .direction-item .icon.dir-green { background: linear-gradient(135deg, #00b578, #4ddba6); }
    .direction-item .icon.dir-blue { background: linear-gradient(135deg, #1677ff, #4096ff); }
    .direction-item .icon.dir-pink { background: linear-gradient(135deg, #eb2f96, #ff85c0); }
    .direction-item .icon.dir-purple { background: linear-gradient(135deg, #722ed1, #9254de); }
    .direction-item .name {
      font-size: 12px;
      color: var(--color-text);
    }

    .apply-card {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 12px;
      background: linear-gradient(135deg, #1677ff, #4096ff);
      color: white;
      padding: 18px 20px;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(22, 119, 255, 0.25);
    }
    .apply-card .apply-icon {
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .apply-card .apply-icon svg { width: 24px; height: 24px; }
    .apply-card .arrow svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <div class="right" style="display:flex;gap:6px;align-items:center;color:#333;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="2" y="7" width="18" height="11" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><line x1="6" y1="11" x2="6" y2="13"/><line x1="11" y1="11" x2="11" y2="13"/><line x1="16" y1="11" x2="16" y2="13"/></svg>
      </div>
    </div>

    <div class="nav-bar">
      <a href="index.html" class="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <div class="title">志愿者服务</div>
      <div class="right"></div>
    </div>

    <!-- Hero -->
    <div class="volunteer-hero">
      <div class="title">加入志愿者队伍</div>
      <div class="subtitle">用爱心传递温暖，用行动服务社区<br>您的一点付出，社区更加美好</div>
      <div class="stats">
        <div>
          <div class="stat-num">128</div>
          <div class="stat-label">在册志愿者</div>
        </div>
        <div>
          <div class="stat-num">356</div>
          <div class="stat-label">服务时长(h)</div>
        </div>
        <div>
          <div class="stat-num">42</div>
          <div class="stat-label">本月活动</div>
        </div>
      </div>
    </div>

    <!-- 服务方向 -->
    <div class="section-title" style="padding: 0 16px;">服务方向</div>
    <div class="direction-grid">
      <div class="direction-item">
        <div class="icon dir-orange">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
        </div>
        <div class="name">扶老助残</div>
      </div>
      <div class="direction-item">
        <div class="icon dir-cyan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <div class="name">文化宣传</div>
      </div>
      <div class="direction-item">
        <div class="icon dir-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22c4-4 4-10 4-14a4 4 0 0 1 4-4 8 8 0 0 1 8 8c0 4-3 8-7 8-2 0-3-1-3-1s-2 2-6 3z"/></svg>
        </div>
        <div class="name">环境保护</div>
      </div>
      <div class="direction-item">
        <div class="icon dir-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div class="name">社区治安</div>
      </div>
      <div class="direction-item">
        <div class="icon dir-pink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </div>
        <div class="name">爱心公益</div>
      </div>
      <div class="direction-item">
        <div class="icon dir-purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1 3 3 6 3s6-2 6-3v-5"/></svg>
        </div>
        <div class="name">教育辅导</div>
      </div>
    </div>

    <!-- 入口 -->
    <div class="section-title" style="padding: 0 16px;">立即申请</div>
    <a href="volunteer-apply.html" class="apply-card">
      <div class="apply-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </div>
      <div style="flex: 1;">
        <div style="font-size: 16px; font-weight: 600;">志愿者申请</div>
        <div style="font-size: 12px; opacity: 0.9; margin-top: 2px;">填写信息，加入我们</div>
      </div>
      <div class="arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </a>

    <a href="volunteer-history.html" class="card" style="display: flex; align-items: center; gap: 12px; margin: 12px;">
      <div style="width: 44px; height: 44px; background: var(--color-green-bg); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--color-green);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M9 2H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2h-2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
      </div>
      <div style="flex: 1;">
        <div style="font-size: 15px; font-weight: 500;">我的申请记录</div>
        <div style="font-size: 12px; color: var(--color-text-weak); margin-top: 2px;">查看申请进度与历史</div>
      </div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" style="color:var(--color-text-faint);"><polyline points="9 18 15 12 9 6"/></svg>
    </a>

    <!-- 申请须知 -->
    <div class="section-title" style="padding: 0 16px;">申请须知</div>
    <div class="card" style="margin: 0 12px;">
      <div style="font-size: 14px; line-height: 1.8; color: var(--color-text-sub);">
        <p>· 申请者须为本社区居民或在本社区工作生活</p>
        <p>· 年满 18 周岁，身体健康，品行端正</p>
        <p>· 提交申请后，社区工作人员会主动与您联系</p>
        <p>· 志愿者服务纯属自愿，无任何报酬</p>
        <p>· 详情可咨询社区服务中心：010-12345678</p>
      </div>
    </div>

    <div style="height: 20px;"></div>

    <div class="tab-bar">
      <a href="index.html" class="tab-item">
        <span class="icon" style="display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        <span>首页</span>
      </a>
      <a href="profile.html" class="tab-item">
        <span class="icon" style="display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <span>我的</span>
      </a>
    </div>
  </div>

  <script src="assets/js/common.js"></script>
</body>
</html>
