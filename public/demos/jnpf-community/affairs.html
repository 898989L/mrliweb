<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧社区 - 事项办理</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .hero-card {
      margin: 12px;
      padding: 20px;
      background: linear-gradient(135deg, #13c2c2, #36cfc9);
      color: white;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }
    .hero-card::before {
      content: '';
      position: absolute;
      right: -30px;
      bottom: -30px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
      border-radius: 50%;
    }
    .hero-card .title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .hero-card .desc {
      font-size: 13px;
      opacity: 0.92;
      line-height: 1.6;
    }

    .entry-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 12px;
    }
    .entry-card {
      background: white;
      padding: 20px 16px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      position: relative;
    }
    .entry-card .icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .entry-card .icon svg { width: 24px; height: 24px; }
    .entry-card .name {
      font-size: 15px;
      font-weight: 600;
    }
    .entry-card .desc {
      font-size: 12px;
      color: var(--color-text-weak);
    }
  </style>
</head>
