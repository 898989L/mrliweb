<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧社区 - 办事预约</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .appt-hero {
      margin: 12px;
      padding: 18px 20px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
      color: white;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .appt-hero .icon {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.22);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .appt-hero .icon svg { width: 24px; height: 24px; }
    .appt-hero .text .title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .appt-hero .text .desc {
      font-size: 12px;
      opacity: 0.92;
      line-height: 1.5;
    }

    .form-card {
      background: white;
      margin: 12px;
      border-radius: 12px;
      padding: 4px 16px;
    }
    .form-hint {
      background: rgba(22, 119, 255, 0.08);
      color: var(--color-info);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin: 12px 12px 0;
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }
    .form-hint svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }

    .form-item-col {
      display: block;
      padding: 12px 0;
      border-bottom: 1px solid var(--color-divider);
    }
    .form-item-col:last-child { border-bottom: none; }
    .form-item-col .form-label {
      margin-bottom: 8px;
    }

    /* 自定义下拉选择器 */
    .form-select-trigger {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      background: #F7F8FA;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      font-size: var(--fs-md);
      color: var(--color-text);
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .form-select-trigger:active {
      background: #F0F1F3;
    }
    .form-select-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .form-select-text.placeholder {
      color: var(--color-text-faint);
    }
    .form-select-arrow {
      font-size: 10px;
      color: var(--color-text-weak);
      margin-left: 8px;
      transition: transform 0.2s;
    }

    .form-item-col input,
    .form-item-col textarea {
      width: 100%;
    }

    .time-slot {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .time-slot .slot {
      padding: 10px 4px;
      background: #F7F8FA;
      border: 1px solid transparent;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      color: var(--color-text-sub);
      cursor: pointer;
    }
    .time-slot .slot.active {
      background: rgba(22, 119, 255, 0.1);
      border-color: var(--color-info);
      color: var(--color-info);
      font-weight: 500;
    }
    .time-slot .slot.disabled {
      background: #FAFAFA;
      color: var(--color-text-faint);
      cursor: not-allowed;
    }

    .submit-bar {
      padding: 16px 12px;
      background: white;
      position: sticky;
      bottom: 0;
      border-top: 1px solid var(--color-divider);
    }

    .agreement {
      margin: 12px 12px 0;
      padding: 12px 14px;
      background: #F7F8FA;
      border-radius: 10px;
    }
    .agreement label {
      display: flex;
      gap: 8px;
      font-size: 13px;
      color: var(--color-text-sub);
      line-height: 1.7;
      align-items: flex-start;
    }
    .agreement input[type="checkbox"] {
      margin-top: 4px;
      accent-color: var(--color-info);
      flex-shrink: 0;
      width: 16px;
      height: 16px;
    }
    .agreement a {
      color: var(--color-info);
    }

    /* 底部弹出选择器 */
    .picker-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: flex-end;
      z-index: 1000;
      animation: fadeIn 0.2s;
    }
    .picker {
      width: 100%;
      max-height: 70vh;
      background: white;
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.25s;
    }
    .picker-header {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--color-divider);
      position: relative;
    }
    .picker-cancel,
    .picker-confirm {
      font-size: 15px;
      background: none;
      border: none;
      padding: 4px 0;
      cursor: pointer;
      font-family: inherit;
    }
    .picker-cancel { color: var(--color-text-sub); }
    .picker-confirm {
      color: var(--color-info);
      margin-left: auto;
      font-weight: 500;
    }
    .picker-title {
      font-size: 16px;
      font-weight: 600;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .picker-options {
      overflow-y: auto;
      max-height: 60vh;
      padding-bottom: env(safe-area-inset-bottom, 8px);
    }
    .picker-option {
      padding: 14px 16px;
      font-size: 15px;
      border-bottom: 1px solid var(--color-divider);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .picker-option:last-child { border-bottom: none; }
    .picker-option:active { background: #F5F5F5; }
    .picker-option.active { color: var(--color-info); font-weight: 500; }
    .picker-option .check {
      color: var(--color-info);
      visibility: hidden;
      display: inline-flex;
    }
    .picker-option .check svg { width: 18px; height: 18px; }
    .picker-option.active .check { visibility: visible; }
    .picker-option .check-text {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <div class="right" style="display:flex;gap:6px;align-items:center;color:#333;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="2" y="7" width="18" height="11" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><line x1="6" y1="11" x2="6" y2="13"/><line x1="11" y1="11" x2="11" y2="13"/><line x1="16" y1="11" x2="16" y2="13"/></svg>
      </div>
    </div>

    <div class="nav-bar">
      <a href="index.html" class="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <div class="title">办事预约</div>
      <a href="affairs-appointment-list.html" class="right" style="font-size: 13px; color: var(--color-primary);">我的预约</a>
    </div>

    <div class="appt-hero">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div class="text">
        <div class="title">在线预约办事</div>
        <div class="desc">提前预约办理时间<br>到现场免排队</div>
      </div>
    </div>

    <div class="form-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26A7 7 0 0 0 12 2z"/></svg>
      <span>提交后社区工作人员会与您确认，请保持手机畅通</span>
    </div>

    <form id="apptForm" onsubmit="return handleSubmit(event)">
      <div class="form-card">
        <div class="form-item-col">
          <label class="form-label"><span class="required">*</span>办理事项</label>
          <div class="form-select-trigger" id="apptTypeTrigger" onclick="openApptPicker()">
            <span class="form-select-text placeholder" id="apptTypeText">请选择要办理的事项</span>
            <span class="form-select-arrow">▼</span>
          </div>
        </div>
        <div class="form-item-col">
          <label class="form-label"><span class="required">*</span>预约日期</label>
          <input type="date" class="form-input" id="apptDate">
        </div>
        <div class="form-item-col">
          <label class="form-label"><span class="required">*</span>预约时间段</label>
          <div class="time-slot" id="timeSlots">
            <div class="slot" data-time="09:00-10:00">09:00-10:00</div>
            <div class="slot" data-time="10:00-11:00">10:00-11:00</div>
            <div class="slot" data-time="11:00-12:00">11:00-12:00</div>
            <div class="slot" data-time="14:00-15:00">14:00-15:00</div>
            <div class="slot" data-time="15:00-16:00">15:00-16:00</div>
            <div class="slot" data-time="16:00-17:00">16:00-17:00</div>
          </div>
        </div>
      </div>

      <div class="form-card">
        <div class="form-item-col">
          <label class="form-label"><span class="required">*</span>联系人姓名</label>
          <input type="text" class="form-input" id="name" placeholder="请输入您的真实姓名">
        </div>
        <div class="form-item-col">
          <label class="form-label"><span class="required">*</span>联系电话</label>
          <input type="tel" class="form-input" id="phone" placeholder="请输入 11 位手机号" maxlength="11">
        </div>
        <div class="form-item-col">
          <label class="form-label">备注</label>
          <textarea class="form-textarea" id="remark" placeholder="如有特殊情况请说明（选填）"></textarea>
        </div>
      </div>

      <div class="agreement">
        <label>
          <input type="checkbox" id="agree" checked>
          <span>我已阅读并同意 <a href="javascript:;">《办事预约须知》</a>，所填信息真实有效</span>
        </label>
      </div>

      <div class="submit-bar">
        <button type="submit" class="btn btn-primary btn-block btn-lg">提交预约</button>
      </div>
    </form>

    <div class="tab-bar">
      <a href="index.html" class="tab-item">
        <span class="icon" style="display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        <span>首页</span>
      </a>
      <a href="profile.html" class="tab-item">
        <span class="icon" style="display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <span>我的</span>
      </a>
    </div>
  </div>

  <script src="assets/js/common.js"></script>
  <script>
    // 办理事项选项
    const apptTypes = [
      { value: '居住证明开具',       label: '居住证明开具' },
      { value: '生育登记',           label: '生育登记' },
      { value: '流动人口登记',       label: '流动人口登记' },
      { value: '婚姻状况证明',       label: '婚姻状况证明' },
      { value: '医保参保登记',       label: '医保参保登记' },
      { value: '老年人优待证办理',   label: '老年人优待证办理' },
      { value: '学生转学手续',       label: '学生转学手续' },
      { value: '失业登记',           label: '失业登记' },
      { value: '__other__',          label: '其他（请在备注中说明）' }
    ];

    let selectedAppt = '';

    // 设置日期默认值为今天
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const todayStr = `${yyyy}-${mm}-${dd}`;
    document.getElementById('apptDate').value = todayStr;
    document.getElementById('apptDate').min = todayStr;

    // 时段选择
    document.querySelectorAll('#timeSlots .slot').forEach(slot => {
      slot.addEventListener('click', () => {
        if (slot.classList.contains('disabled')) return;
        document.querySelectorAll('#timeSlots .slot').forEach(s => s.classList.remove('active'));
        slot.classList.add('active');
      });
    });

    // 打开事项选择器
    function openApptPicker() {
      const mask = document.createElement('div');
      mask.className = 'picker-mask';

      const optionsHtml = apptTypes.map(o => `
        <div class="picker-option${o.value === selectedAppt ? ' active' : ''}" data-value="${o.value}">
          <span>${o.label}</span>
          <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        </div>
      `).join('');

      mask.innerHTML = `
        <div class="picker">
          <div class="picker-header">
            <button class="picker-cancel" type="button">取消</button>
            <div class="picker-title">选择办理事项</div>
            <button class="picker-confirm" type="button">确定</button>
          </div>
          <div class="picker-options">${optionsHtml}</div>
        </div>
      `;
      document.body.appendChild(mask);

      let picked = selectedAppt;

      mask.querySelectorAll('.picker-option').forEach(opt => {
        opt.addEventListener('click', () => {
          mask.querySelectorAll('.picker-option').forEach(o => o.classList.remove('active'));
          opt.classList.add('active');
          picked = opt.dataset.value;
        });
      });

      const close = () => mask.remove();
      mask.querySelector('.picker-cancel').addEventListener('click', close);
      mask.addEventListener('click', e => { if (e.target === mask) close(); });
      mask.querySelector('.picker-confirm').addEventListener('click', () => {
        if (picked) {
          selectedAppt = picked;
          const opt = apptTypes.find(o => o.value === picked);
          const textEl = document.getElementById('apptTypeText');
          textEl.textContent = opt.label;
          textEl.classList.remove('placeholder');
        }
        close();
      });
    }

    function handleSubmit(e) {
      e.preventDefault();
      const date = document.getElementById('apptDate').value;
      const slot = document.querySelector('#timeSlots .slot.active');
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const agreed = document.getElementById('agree').checked;

      if (!selectedAppt) { showToast('请选择办理事项'); return false; }
      if (!date) { showToast('请选择预约日期'); return false; }
      if (!slot) { showToast('请选择预约时间段'); return false; }
      if (!name) { showToast('请输入联系人姓名'); return false; }
      if (!phone) { showToast('请输入联系电话'); return false; }
      if (!validatePhone(phone)) { showToast('手机号格式不正确'); return false; }
      if (!agreed) { showToast('请先同意预约须知'); return false; }

      const typeText = selectedAppt === '__other__'
        ? '其他（详见备注）'
        : apptTypes.find(o => o.value === selectedAppt).label;
      const timeText = slot.dataset.time;

      const svg = (paths) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="vertical-align:-2px;margin-right:4px;">${paths}</svg>`;
      const modalStyle = 'display:flex;align-items:center;gap:6px;font-size:14px;line-height:1.9;';
      showModal({
        title: '确认预约信息',
        content: `<div style="text-align:left;line-height:2;">
          <div style="${modalStyle}">${svg('<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h.01M9 16h.01M13 12h3M13 16h3"/>')}<span><b>办理事项：</b>${typeText}</span></div>
          <div style="${modalStyle}">${svg('<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>')}<span><b>预约时间：</b>${date} ${timeText}</span></div>
          <div style="${modalStyle}">${svg('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>')}<span><b>联系人：</b>${name}</span></div>
          <div style="${modalStyle}">${svg('<rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>')}<span><b>联系电话：</b>${phone}</span></div>
        </div>`,
        confirmText: '确认提交',
        onConfirm: () => {
          showToast('提交中...', 1200);
          setTimeout(() => {
            showToast('预约成功！');
            setTimeout(() => location.href = 'affairs-appointment-list.html', 800);
          }, 1000);
        }
      });
      return false;
    }
  </script>
</body>
</html>
