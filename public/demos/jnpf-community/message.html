<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧社区 - 消息中心</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .cat-tabs {
      display: flex;
      background: white;
      padding: 0 12px;
      border-bottom: 1px solid var(--color-divider);
    }
    .cat-tab {
      padding: 12px 14px;
      font-size: 14px;
      color: var(--color-text-sub);
      position: relative;
      cursor: pointer;
    }
    .cat-tab.active {
      color: var(--color-primary);
      font-weight: 600;
    }
    .cat-tab.active::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
      background: var(--color-primary);
      border-radius: 2px;
    }

    .msg-item {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      background: white;
      border-bottom: 1px solid var(--color-divider);
      cursor: pointer;
      position: relative;
    }
    .msg-item:active { background: #FAFAFA; }
    .msg-item .icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-shrink: 0;
    }
    .msg-item .icon-wrap svg { width: 22px; height: 22px; }
    .msg-item .body {
      flex: 1;
      min-width: 0;
    }
    .msg-item .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .msg-item .title {
      font-size: 15px;
      font-weight: 500;
    }
    .msg-item .time {
      font-size: 11px;
      color: var(--color-text-weak);
    }
    .msg-item .summary {
      font-size: 13px;
      color: var(--color-text-sub);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .msg-item .unread-dot {
      position: absolute;
      right: 16px;
      bottom: 18px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-warning);
    }

    .tool-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: white;
      border-bottom: 1px solid var(--color-divider);
      font-size: 12px;
      color: var(--color-text-weak);
    }
    .tool-bar .action {
      color: var(--color-primary);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <div class="right" style="display:flex;gap:6px;align-items:center;color:#333;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="2" y="7" width="18" height="11" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><line x1="6" y1="11" x2="6" y2="13"/><line x1="11" y1="11" x2="11" y2="13"/><line x1="16" y1="11" x2="16" y2="13"/></svg>
      </div>
    </div>

    <div class="nav-bar">
      <div class="back" style="visibility: hidden;"></div>
      <div class="title">消息中心</div>
      <div class="right">
        <span style="font-size: 14px; color: var(--color-primary); cursor: pointer;" onclick="markAllRead()">全部已读</span>
      </div>
    </div>

    <div class="cat-tabs">
      <div class="cat-tab active">全部</div>
      <div class="cat-tab">系统通知</div>
      <div class="cat-tab">活动通知</div>
      <div class="cat-tab">办件通知</div>
    </div>

    <div class="tool-bar">
      <span>共 4 条消息，2 条未读</span>
    </div>

    <a href="message-detail.html" class="msg-item">
      <div class="icon-wrap" style="background: linear-gradient(135deg, var(--color-orange), var(--color-orange-light));"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
      <div class="body">
        <div class="top">
          <div class="title">活动报名成功</div>
          <div class="time">10:23</div>
        </div>
        <div class="summary">您已成功报名"端午节包粽子活动"，请于 6 月 8 日 14:00 前到达社区文化中心...</div>
      </div>
      <div class="unread-dot"></div>
    </a>

    <a href="message-detail.html" class="msg-item">
      <div class="icon-wrap" style="background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h.01M9 16h.01M13 12h3M13 16h3"/></svg></div>
      <div class="body">
        <div class="top">
          <div class="title">办件已受理</div>
          <div class="time">昨天</div>
        </div>
        <div class="summary">您提交的"居住证明开具"申请已受理，预计 3 个工作日内完成...</div>
      </div>
      <div class="unread-dot"></div>
    </a>

    <a href="message-detail.html" class="msg-item">
      <div class="icon-wrap" style="background: linear-gradient(135deg, var(--color-success), #7DD957);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="body">
        <div class="top">
          <div class="title">办件已办结</div>
          <div class="time">5-25</div>
        </div>
        <div class="summary">您的"生育登记"业务已办结完成，可前往社区服务中心领取证件...</div>
      </div>
    </a>

    <a href="message-detail.html" class="msg-item">
      <div class="icon-wrap" style="background: linear-gradient(135deg, var(--color-gray), #BFBFBF);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></div>
      <div class="body">
        <div class="top">
          <div class="title">系统升级通知</div>
          <div class="time">5-20</div>
        </div>
        <div class="summary">智慧社区小程序将于 5 月 22 日 02:00-04:00 进行系统升级...</div>
      </div>
    </a>

    <a href="message-detail.html" class="msg-item">
      <div class="icon-wrap" style="background: linear-gradient(135deg, var(--color-purple), var(--color-purple-light));"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17a2.5 2.5 0 0 0 2 0c1.55-.78 2-2.5 2-4.5V6a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v6.5c0 2 .45 3.72 2 4.5a2.5 2.5 0 0 0 2 0z"/><path d="M9 12h6"/></svg></div>
      <div class="body">
        <div class="top">
          <div class="title">志愿者申请通过</div>
          <div class="time">5-13</div>
        </div>
        <div class="summary">恭喜！您的志愿者申请已通过审核，欢迎加入阳光花园志愿者服务队...</div>
      </div>
    </a>

    <div class="tab-bar">
      <a href="index.html" class="tab-item">
        <span class="icon" style="display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        <span>首页</span>
      </a>
      <a href="profile.html" class="tab-item">
        <span class="icon" style="display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <span>我的</span>
      </a>
    </div>
  </div>

  <script src="assets/js/common.js"></script>
  <script>
    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });

    function markAllRead() {
      document.querySelectorAll('.unread-dot').forEach(d => d.remove());
      showToast('已全部标记为已读');
    }
  </script>
</body>
</html>
