<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧社区 - 我的办件</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .search-card {
      background: white;
      margin: 12px;
      padding: 16px;
      border-radius: 12px;
    }
    .search-card .input-row {
      display: flex;
      gap: 8px;
    }
    .search-card input {
      flex: 1;
      height: 40px;
      padding: 0 12px;
      background: #F7F8FA;
      border-radius: 8px;
      font-size: 14px;
    }
    .search-card input:focus {
      background: white;
      box-shadow: 0 0 0 2px var(--color-primary);
    }
    .search-card button {
      height: 40px;
      padding: 0 20px;
      background: var(--color-primary);
      color: white;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }
    .search-card .tip {
      margin-top: 8px;
      font-size: 12px;
      color: var(--color-text-weak);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .search-card .tip svg { width: 12px; height: 12px; flex-shrink: 0; }
    .meta-icon { width: 12px; height: 12px; vertical-align: -2px; margin-right: 2px; color: var(--color-text-weak); }

    .case-item {
      background: white;
      margin: 0 12px 10px;
      padding: 14px 16px;
      border-radius: 12px;
    }
    .case-item .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--color-divider);
    }
    .case-item .id {
      font-size: 12px;
      color: var(--color-text-weak);
    }
    .case-item .title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .case-item .meta {
      font-size: 12px;
      color: var(--color-text-weak);
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <div class="right" style="display:flex;gap:6px;align-items:center;color:#333;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="2" y="7" width="18" height="11" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><line x1="6" y1="11" x2="6" y2="13"/><line x1="11" y1="11" x2="11" y2="13"/><line x1="16" y1="11" x2="16" y2="13"/></svg>
      </div>
    </div>

    <div class="nav-bar">
      <a href="affairs.html" class="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <div class="title">我的办件</div>
      <div class="right"></div>
    </div>

    <!-- 查询 -->
    <div class="search-card">
      <div class="input-row">
        <input type="tel" id="phoneInput" placeholder="请输入手机号查询" maxlength="11">
        <button onclick="doQuery()">查询</button>
      </div>
      <div class="tip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26A7 7 0 0 0 12 2z"/></svg>
        输入办理时使用的手机号，查询您的办件记录
      </div>
    </div>

    <!-- 办件列表 -->
    <div id="result">
      <div style="padding: 0 16px; font-size: 13px; color: var(--color-text-weak); margin-bottom: 8px;">
        找到 3 条办件记录
      </div>

      <div class="case-item">
        <div class="header">
          <span class="id">BJ20260603003</span>
          <span class="badge badge-info">已提交</span>
        </div>
        <div class="title">流动人口登记</div>
        <div class="meta"><svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>提交时间：2026-06-03 09:15</div>
        <div class="meta"><svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>办理窗口：社区服务中心</div>
      </div>

      <div class="case-item">
        <div class="header">
          <span class="id">BJ20260601001</span>
          <span class="badge badge-primary">已受理</span>
        </div>
        <div class="title">居住证明开具</div>
        <div class="meta"><svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>提交时间：2026-06-01 10:30</div>
        <div class="meta"><svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>预计完成：2026-06-04 前</div>
        <div style="margin-top: 8px; padding: 6px 10px; background: var(--color-primary-bg); border-radius: 6px; font-size: 12px; color: var(--color-primary);">
          您的申请已进入审核阶段，请耐心等待
        </div>
      </div>

      <div class="case-item">
        <div class="header">
          <span class="id">BJ20260525002</span>
          <span class="badge badge-success">已办结</span>
        </div>
        <div class="title">生育登记</div>
        <div class="meta"><svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>提交时间：2026-05-25 14:20</div>
        <div class="meta"><svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-success);"><polyline points="20 6 9 17 4 12"/></svg>办结时间：2026-05-25 14:35</div>
        <div style="margin-top: 8px;">
          <a href="javascript:;" style="font-size: 12px; color: var(--color-primary);">查看回执 ›</a>
        </div>
      </div>
    </div>

    <div style="text-align: center; padding: 16px; color: var(--color-text-weak); font-size: 12px;">
      — 没有更多了 —
    </div>

    <div class="tab-bar">
      <a href="index.html" class="tab-item">
        <span class="icon" style="display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        <span>首页</span>
      </a>
      <a href="profile.html" class="tab-item">
        <span class="icon" style="display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <span>我的</span>
      </a>
    </div>
  </div>

  <script src="assets/js/common.js"></script>
  <script>
    function doQuery() {
      const phone = document.getElementById('phoneInput').value.trim();
      if (!phone) {
        showToast('请输入手机号');
        return;
      }
      if (!validatePhone(phone)) {
        showToast('手机号格式不正确');
        return;
      }
      showToast('查询中...', 800);
      setTimeout(() => showToast('查询完成'), 800);
    }
  </script>
</body>
</html>
